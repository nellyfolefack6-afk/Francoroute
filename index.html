 {id:'fear',icon:'shield',label:['Peur d’échouer','Fear of failing','Miedo a fallar','الخوف من الإخفاق'],
 title:['Un résultat ne définit pas ma valeur.','A result does not define my worth.','Un resultado no define mi valor.','نتيجة الامتحان لا تحدد قيمتي.'],
 body:['Vous pouvez souhaiter réussir sans exiger de vous une certitude. La pensée « je vais échouer » est une crainte, pas un résultat déjà connu.','You can want to pass without demanding certainty from yourself. “I am going to fail” is a fear, not a result you already know.','Puedes querer aprobar sin exigirte certeza. «Voy a fallar» es un temor, no un resultado que ya conoces.','يمكنك الرغبة في النجاح دون مطالبة نفسك باليقين. فكرة «سأخفق» هي خوف وليست نتيجة معروفة مسبقاً.'],
 actions:[['Nommer la crainte : « En ce moment, j’ai peur de… » sans me juger.','Name the worry: “Right now, I am afraid of…” without judging myself.','Nombrar el temor: «Ahora tengo miedo de…» sin juzgarme.','تسمية الخوف: «في هذه اللحظة أخاف من…» دون لوم نفسي.'],['Choisir ce qui dépend de moi : pratiquer une difficulté précise avec mon moniteur.','Choose what I can influence: practise one specific difficulty with my instructor.','Elegir lo que depende de mí: practicar una dificultad concreta con mi instructor.','اختيار ما أستطيع فعله: التدرب على صعوبة محددة مع مدرّبي.'],['Prévoir une personne à qui parler après l’examen, quel que soit le résultat.','Choose someone to talk to after the test, whatever the result.','Elegir a alguien con quien hablar después del examen, sea cual sea el resultado.','تحديد شخص أتحدث معه بعد الامتحان، مهما كانت النتيجة.']],

 body:['La déception peut être présente. Vous pouvez prendre un temps avant de relire le compte rendu. Ensuite, distinguez ce qui a été difficile de ce que vous savez déjà faire.','It is okay to feel disappointed. You can take some time before reading the feedback. Then separate what was difficult from what you can already do.','Puede haber decepción. Puedes darte un tiempo antes de leer la evaluación. Luego distingue lo que fue difícil de lo que ya sabes hacer.','قد تشعر بخيبة أمل. يمكنك أخذ وقت قبل قراءة الملاحظات، ثم التمييز بين ما كان صعباً وما تتقنه بالفعل.'],
 actions:[['Repérer une difficulté précise dans le compte rendu, sans me coller une étiquette.','Identify one specific difficulty in the feedback, without labelling myself.','Identificar una dificultad concreta en la evaluación, sin ponerme etiquetas.','تحديد صعوبة واحدة في الملاحظات دون الحكم على نفسي.'],['Demander au moniteur un exercice ciblé et un retour concret.','Ask my instructor for a focused exercise and specific feedback.','Pedir a mi instructor un ejercicio específico y comentarios concretos.','طلب تمرين محدد وملاحظات واضحة من مدرّبي.'],['Décider de la suite après en avoir parlé, sans me précipiter sous la pression.','Decide what comes next after talking it through, without rushing under pressure.','Decidir cómo seguir después de conversarlo, sin precipitarme por la presión.','تحديد الخطوة التالية بعد مناقشتها، دون استعجال بسبب الضغط.']],

let prepTopic='before',prepPhrase=0,prepStep=-1,mobileMore=false;

function renderPreparation(){const q=prepSelected(),checks=prepChecks();return `${head(t('prepareTitle'),t('prepareSub'))}<div class="prep-safety">${icon('parking')}<span>${t('prepareSafety')}</span></div><section class="prep-choices" aria-labelledby="prepChoiceTitle"><h2 id="prepChoiceTitle">${t('prepareChoose')}</h2><div class="prep-choice-grid">${PREP_TOPICS.map(x=>`<button class="prep-choice ${q.id===x.id?'selected':''}" data-action="prep-topic" data-id="${x.id}" aria-pressed="${q.id===x.id}">${icon(x.icon)}<span>${pick(x.label)}</span></button>`).join('')}</div></section><div class="prep-layout"><div class="prep-main"><article class="card prep-topic" id="prepTopic"><span class="eyebrow">${pick(q.label)}</span><h2>${pick(q.title)}</h2><p class="prep-lead">${pick(q.body)}</p><h3>${t('prepareActions')}</h3><ol class="prep-action-list">${q.actions.map((a,i)=>`<li><span aria-hidden="true">${number(i+1)}</span><p>${pick(a)}</p></li>`).join('')}</ol>${q.id==='setback'?nav(t('preparePlan'),'plan','arrow','btn secondary'):''}</article>${prepRoutine()}</div><aside class="prep-aside"><section class="prep-phrase"><span class="eyebrow">${t('prepareQuote')}</span><blockquote aria-live="polite">${pick(q.phrases[prepPhrase%q.phrases.length])}</blockquote>${btn(`${icon('refresh')} ${t('prepareAnother')}`,'prep-phrase','secondary')}</section><section class="card prep-talk"><h2>${t('prepareTalk')}</h2><p>${t('prepareTalkBody')}</p>${nav(t('contact'),'help','arrow','btn ghost')}</section></aside></div><section class="card prep-checklist"><h2>${t('prepareChecklist')}</h2><p>${t('prepareChecklistSub')}</p><div>${PREP_CHECKS.map((c,i)=>`<label><input type="checkbox" data-prep-check="${i}" ${checks.includes(i)?'checked':''}><span>${pick(c)}</span></label>`).join('')}</div><small>${t('prepareLocal')}</small></section><section class="prep-support"><div>${icon('people')}<h2>${t('prepareHelpTitle')}</h2></div><p>${t('prepareHelpBody')}</p><p class="prep-scope">${t('prepareScope')}</p><details><summary>${t('prepareSources')}</summary><p>${t('prepareSourceNote')}</p><ul>${[['prepareSourceBreath','https://www.nhs.uk/mental-health/self-help/guides-tools-and-activities/breathing-exercises-for-stress/'],['prepareSourceTrauma','https://www.camh.ca/en/health-info/mental-illness-and-addiction-index/trauma'],['prepareSourceSupport','https://www.camh.ca/en/health-info/mental-illness-and-addiction-index/posttraumatic-stress-disorder'],['prepareSourceGround','https://www.camh.ca/en/camh-news-and-stories/supporting-the-mental-health-of-first-responders-and-medical-professionals']].map(([k,u])=>`<li><a href="${u}" target="_blank" rel="noopener noreferrer">${t(k)} ${icon('external')}</a></li>`).join('')}</ul></details></section>`;}
function updatePrepRoutine(){const region=$('#prepRoutine');if(!region)return;region.outerHTML=prepRoutine();$('#prepStep')?.focus({preventScroll:true});$('#prepRoutine')?.scrollIntoView({block:'nearest',behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(e.target.closest('[data-go]'))mobileMore=false;if(!b||b.disabled)return;const a=b.dataset.action;if(a==='mobile-more'){mobileMore=!mobileMore;render();$('[data-action="mobile-more"]')?.focus({preventScroll:true});}else if(a==='prep-topic'){if(!PREP_TOPICS.some(x=>x.id===b.dataset.id))return;prepTopic=b.dataset.id;prepPhrase=0;render();$(`[data-action="prep-topic"][data-id="${prepTopic}"]`)?.focus({preventScroll:true});}else if(a==='prep-phrase'){prepPhrase=(prepPhrase+1)%prepSelected().phrases.length;const quote=$('.prep-phrase blockquote');if(quote)quote.textContent=pick(prepSelected().phrases[prepPhrase]);}else if(a==='prep-start'){prepStep=0;updatePrepRoutine();}else if(a==='prep-next'&&prepStep>=0&&prepStep<PREP_STEPS.length){prepStep++;updatePrepRoutine();}else if(a==='prep-stop'){prepStep=-1;updatePrepRoutine();$('[data-action="prep-start"]')?.focus({preventScroll:true});}});
document.addEventListener('change',e=>{if(e.target.dataset.prepCheck===undefined)return;const n=Number(e.target.dataset.prepCheck);if(!Number.isInteger(n)||n<0||n>=PREP_CHECKS.length)return;const checks=prepChecks();state.preparation.checks=e.target.checked?[...new Set([...checks,n])]:checks.filter(x=>x!==n);persist();});

function shuffle(arr){const out=[...arr];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function sourceUrl(q){return q.source?.startsWith('https:')?q.source:'https://www.ontario.ca/document/official-mto-drivers-handbook/'+(q.source||'signs');}
function sourceLink(q){return `<a class="source-link" href="${sourceUrl(q)}" target="_blank" rel="noopener noreferrer">${t('source')} ${icon('external')}</a>`;}

function stats(){const entries=QUESTIONS.filter(q=>state.answers[q.id]);return {seen:entries.length,right:entries.filter(q=>state.answers[q.id].correct).length,wrong:entries.filter(q=>!state.answers[q.id].correct).length};}

function renderOptions(q,order,selected,showFeedback,action){const d=data(q);return `<div class="options">${order.map((idx,pos)=>{const correct=showFeedback&&idx===d.ans;const wrong=showFeedback&&selected===idx&&!correct;return `<button class="option ${correct?'correct':wrong?'wrong':selected===idx?'selected':''}" data-action="${action}" data-id="${idx}" ${showFeedback?'disabled':''} aria-pressed="${selected===idx}"><span class="letter">${String.fromCharCode(65+pos)}</span><span>${esc(d.opts[idx])}</span>${correct?`<span class="answer-mark">${icon('check')}</span>`:wrong?`<span class="answer-mark">${icon('close')}</span>`:''}</button>`}).join('')}</div>`;}
function renderQuiz(){const s=state.session;if(!s){route='learn';return renderLearn();}const q=byId(s.ids[s.index]);if(!q){state.session=null;persist();route='learn';return renderLearn();}const d=data(q),isExam=s.mode==='exam';const show=s.feedback&&!isExam;const progress=s.index/s.ids.length*100;return `<div class="quiz-wrap"><div class="quiz-top">${btn(`${icon('left')} ${t('pause')}`,'pause','ghost')}<span class="tag ${isExam?'navy':''}">${t(isExam?'exam':'quiz')}</span><span class="muted">${t('question')} <b>${number(s.index+1)}</b> ${t('of')} ${number(s.ids.length)}</span></div><div class="progress-track" role="progressbar" aria-label="${t('progress')}" aria-valuenow="${s.index}" aria-valuemin="0" aria-valuemax="${s.ids.length}"><div class="progress-fill" style="width:${progress}%"></div></div><article class="card quiz-card"><div class="question-kicker"><span class="eyebrow" style="margin:0">${isExam?`${t('section')} ${q.theme===1?'1':'2'} · ${t(q.theme===1?'signs':'rules')}`:t('theme'+q.theme)}</span></div><h2 id="questionTitle">${esc(d.q)}</h2>${questionImage(q)}${renderOptions(q,s.order[q.id],s.selected,show,'choose')}${show?`<div class="feedback ${s.selected===d.ans?'':'bad'}" role="status"><h3>${icon(s.selected===d.ans?'check':'info')} ${t(s.selected===d.ans?'correct':'incorrect')}</h3><p>${esc(d.exp)}</p>${sourceLink(q)}</div>`:''}<div class="quiz-footer">${isExam?`<span class="small">${t('examMode')}</span>`:''}${btn(`${t(show||isExam?(s.index===s.ids.length-1?'finish':'next'):'confirm')} ${icon('arrow')}`,show||isExam?'next-question':'validate','',s.selected===null?'disabled':'')}</div></article><div class="foot-note">${icon('shield')}<span>${t('local')}</span></div></div>`;}
function renderExam(){return `${head(t('examTitle'),t('examSub'),'G1')}${prepShortcut()}<div class="exam-intro"><div class="exam-panels">${[['signs','sign'],['rules','book']].map(([k,i])=>`<article class="card"><div class="theme-symbol">${icon(i)}</div><h3 style="margin-top:15px">${t(k)}</h3><div class="big-number">20 <span class="small">${t('questions')}</span></div><span class="tag green">16/20 · ${t('minSection')}</span></article>`).join('')}</div><div class="exam-info">${t('passNote')}</div><div class="card"><h3>${t('exam')}</h3><ul class="checks">${[1,2,3].map(i=>`<li>${icon('check')}<span>${t('examCheck'+i)}</span></li>`).join('')}</ul><div class="action-row">${btn(`${t('startExam')} ${icon('arrow')}`,'start-exam')}${state.session?.mode==='exam'?btn(t('continue'),'resume','secondary'):''}</div></div>${foot()}</div>`;}
function renderResult(){const r=state.lastResult;if(!r){return renderProgress();}const correct=r.answers.filter(a=>a.correct).length;const signs=r.answers.filter(a=>byId(a.id)?.theme===1&&a.correct).length;const rules=correct-signs;const pass=r.mode==='exam'?signs>=16&&rules>=16:correct/r.answers.length>=.8;return `<div class="result">${head(t('resultTitle'),'',t('completed'))}${!pass?prepShortcut():''}<section class="result-banner"><span class="tag">${t(r.mode==='exam'?'exam':'quiz')}</span><h2>${t(pass?'passed':'notYet')}</h2><div class="result-number">${number(correct)}<span style="font-size:1.6rem;font-weight:500;color:#b5c9df"> / ${number(r.answers.length)}</span></div><p>${t('resultSub')}</p></section>${r.mode==='exam'?`<div class="result-sections">${[['signs',signs],['rules',rules]].map(([key,n])=>`<div class="result-section"><span class="small">${t(key)}</span><strong>${number(n)} / 20</strong><span class="tag ${n>=16?'green':'gold'}">${t(n>=16?'pass':'fail')} · 16/20</span></div>`).join('')}</div>`:''}<div class="action-row" style="margin-bottom:25px">${correct<r.answers.length?btn(t('reviewNow'),'review-result'):''}${nav(t('backHome'),'home','home','btn secondary')}</div><div class="card"><h3>${t('reviewAnswers')}</h3>${r.answers.map(a=>{const q=byId(a.id);if(!q)return '';const d=data(q);return `<article class="review-item"><h3>${icon(a.correct?'check':'refresh')} ${esc(d.q)}</h3>${q.signKey?`<img src="${SIGNS.find(s=>s.key===q.signKey).image}" alt="${t('signQuestion')}" style="height:70px;max-width:100px;object-fit:contain;margin-top:12px">`:''}<p class="${a.correct?'correct-text':'wrong-text'}">${t('yourAnswer')} : ${esc(d.opts[a.answer])}</p>${!a.correct?`<p class="correct-text">${t('rightAnswer')} : ${esc(d.opts[d.ans])}</p>`:''}<p class="muted">${esc(d.exp)}</p>${sourceLink(q)}</article>`}).join('')}</div></div>`;}
function diagram(kind,large=false){const lights=['amber','green','red'].includes(kind);const road='#bdcbd9',dark='#60778c';const car=(x,y,color='#1267db',rotate=0)=>`<g transform="translate(${x} ${y}) rotate(${rotate})"><rect x="-10" y="-18" width="20" height="36" rx="5" fill="${color}"/><rect x="-7" y="-10" width="14" height="8" rx="2" fill="#dcecff"/><rect x="-7" y="9" width="14" height="5" rx="1" fill="#dcecff"/></g>`;let body='';if(lights||['stop','turn'].includes(kind)){body=`<path d="M0 61h300v58H0 M117 0h66v180h-66" fill="${road}"/><path d="M150 0v43m0 99v38 M0 90h100m100 0h100" stroke="white" stroke-width="3" stroke-dasharray="10 10"/><path d="M153 131h27" stroke="white" stroke-width="4"/>${car(167,157)}${kind==='turn'?'<path d="M168 130V111q0-12 14-12h45" stroke="#1567dc" stroke-width="4" fill="none"/><path d="m218 92 10 7-10 7" fill="none" stroke="#1567dc" stroke-width="4"/>':''}${lights?`<rect x="197" y="118" width="24" height="59" rx="7" fill="#17324c"/>${['red','amber','green'].map((c,i)=>`<circle cx="209" cy="${130+i*17}" r="6" fill="${kind===c?{red:'#da4151',amber:'#e6a623',green:'#2daa72'}[c]:'#405972'}"/>`).join('')}`:''}${kind==='stop'?'<polygon points="198,132 208,122 221,122 231,132 231,144 221,154 208,154 198,144" fill="#ce303d"/><text x="214.5" y="142" font-size="8" font-weight="bold" text-anchor="middle" fill="white">STOP</text>':''}${kind==='green'?'<path d="M124 120v10m10-10v10m10-10v10m10-10v10m10-10v10m10-10v10" stroke="white" stroke-width="6"/><circle cx="141" cy="125" r="7" fill="#172c47"/>':''}`;}else if(kind==='parking'){body=`<path d="M30 15v135h230V15 M85 15v75m58-75v75m58-75v75" stroke="${dark}" stroke-width="3" fill="none"/><path d="M30 90h230" stroke="${dark}" stroke-width="3"/>${car(115,55,'#1267db',-13)}${car(58,52,'#7791a9')}${car(230,53,'#7791a9')}<path d="M114 112v40" stroke="#1467dc" stroke-dasharray="5 5" stroke-width="3"/><path d="m108 147 6 7 6-7" fill="none" stroke="#1467dc" stroke-width="3"/>`;}else{body=`<rect x="53" y="0" width="180" height="180" fill="${road}"/><path d="M112 0v180m60-180v180" stroke="white" stroke-width="3" stroke-dasharray="12 10"/>${car(kind==='merge'?211:142,140)}${car(83,48,'#73899d')}${kind==='gap'?`${car(142,42,'#6c879f')}<path d="M143 70v39" stroke="#1267db" stroke-width="3" stroke-dasharray="5 5"/>`:kind==='lane'?`${car(199,82,'#dc9c2c')}<path d="m157 108 24-22" stroke="#1467dc" stroke-width="4" stroke-dasharray="5 5"/>`:kind==='merge'?'<path d="M267 180 222 80" stroke="#60809e" stroke-width="3"/><path d="M210 119 157 72" stroke="#1267db" stroke-width="4" stroke-dasharray="6 5"/>':kind==='exit'?'<path d="M229 75 291 22" stroke="#60778c" stroke-width="3"/><path d="M204 142V88l39-38" stroke="#1467dc" stroke-width="4" fill="none"/>':kind==='speed'?'<rect x="241" y="28" width="45" height="65" rx="4" fill="white" stroke="#172d42" stroke-width="2"/><text x="263.5" y="47" font-size="7" font-weight="bold" text-anchor="middle">MAXIMUM</text><text x="263.5" y="74" font-size="23" font-weight="bold" text-anchor="middle">40</text>':''}`;}return `<svg viewBox="0 0 300 180" role="img" aria-label="${t('diagram')}"><rect width="300" height="180" rx="12" fill="#edf3f9"/>${body}</svg>`;}
function renderPractice(){const ss=SCENARIOS.filter(s=>scenarioFilter==='all'||s.level===scenarioFilter);return `${head(t('practiceTitle'),t('practiceSub'),'G2 · G')}<div class="notice" style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><span>${t('retestShortcut')}</span>${nav(t('retryPath'),'plan','refresh','btn secondary small')}</div><div class="filter-bar">${[['all','all'],['G2','city'],['G','highway']].map(([v,k])=>`<button class="chip ${scenarioFilter===v?'active':''}" data-action="filter" data-id="${v}" aria-pressed="${scenarioFilter===v}">${t(k)}</button>`).join('')}</div><div class="scenario-grid">${ss.map(sc=>`<article class="card scenario-card"><div class="scenario-visual">${diagram(sc.scene)}</div><div class="scenario-body"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="tag ${sc.level==='G'?'navy':'green'}">${t(sc.level==='G'?'highway':'city')}</span>${state.scenarioScores[sc.id]?`<span title="${t('scenarioDone')}">${icon('check')}</span>`:''}</div><h3>${esc(pick(sc.title))}</h3><p>${esc(pick(sc.intro))}</p>${nav(`${t('openScenario')} ${icon('arrow')}`,'scenario/'+sc.id,'play','btn ghost small')}</div></article>`).join('')}</div>${foot()}`;}
function renderScenario(){const sc=SCENARIOS.find(s=>s.id===detail)||SCENARIOS[0],q=byId(sc.q),d=data(q),iss=ISSUES.find(i=>i.id===sc.issue);return `<div class="quiz-wrap"><div class="back">${nav(t('back'),'practice','left','btn ghost')}</div>${head(esc(pick(sc.title)),esc(pick(sc.intro)),sc.level)}<article class="card quiz-card"><div class="scenario-detail-visual">${diagram(sc.scene,true)}</div><p class="illustration-caption">${t('diagram')}</p><h2>${esc(d.q)}</h2>${renderOptions(q,scenarioOrder[sc.id]||[0,1,2,3],scenarioSelection,scenarioAnswered,'scenario-choose')}${!scenarioAnswered?`<div class="quiz-footer">${btn(t('confirm'),'scenario-validate','',scenarioSelection===null?'disabled':'')}</div>`:`<div class="feedback ${scenarioSelection===d.ans?'':'bad'}" role="status"><h3>${icon(scenarioSelection===d.ans?'check':'info')} ${t(scenarioSelection===d.ans?'correct':'incorrect')}</h3><p>${esc(d.exp)}</p>${sourceLink(q)}<div class="steps">${[['observe','observe'],['decide','decide'],['act','act']].map(([k,key])=>`<div class="step"><b>${t(key)}</b>${esc(pick(iss[k]))}</div>`).join('')}</div><div class="practice-note"><h3>${t('withInstructor')}</h3><p style="margin-top:8px">${esc(pick(iss.exercise))}</p></div></div><div class="action-row" style="margin-top:20px">${btn(`${icon('exam')} ${t('addPlan')}`,'add-plan','',`data-id="${iss.id}"`)}${nav(t('scenarios'),'practice','arrow','btn secondary')}</div>`}</article></div>`;}
function renderPlan(){const selected=ISSUES.filter(i=>state.plan.issues.includes(i.id));return `${head(t('planTitle'),t('planSub'),'G2 · G')}${prepShortcut()}<div class="print-only"><b>FrancoRoute</b> · ${new Date().toLocaleDateString(language)}</div><section class="card"><h2>${t('planSelect')}</h2><div class="selection-grid">${ISSUES.map(i=>`<label class="select-card"><input type="checkbox" data-issue="${i.id}" ${state.plan.issues.includes(i.id)?'checked':''}>${icon(i.icon)}<span>${t(i.key)}</span></label>`).join('')}</div><div class="notice no-print">${t('planNote')}</div></section><section class="card spacer-top"><div class="section-head"><h2>${t('planActions')}</h2>${selected.length?btn(`${icon('print')} ${t('print')}`,'print','secondary small'):''}</div>${selected.length?selected.map(i=>`<article class="plan-row"><div><h3>${t(i.key)}</h3><p>${esc(pick(i.objective))}</p>${nav(t('planPractice'),'scenario/'+SCENARIOS.find(s=>s.issue===i.id).id,'arrow','btn ghost small')}</div><div class="labeled" style="margin:0"><label for="status-${i.id}">${t('status')}</label><select class="field" id="status-${i.id}" data-status="${i.id}">${[0,1,2].map(n=>`<option value="${n}" ${Number(state.plan.statuses[i.id]||0)===n?'selected':''}>${t('status'+n)}</option>`).join('')}</select></div></article>`).join(''):`<div class="empty">${icon('exam')}<p>${t('noPlan')}</p></div>`}<div class="plan-notes"><label for="planNotes">${t('notes')}</label><textarea class="field" id="planNotes" dir="auto" maxlength="3000" placeholder="${t('notesPlaceholder')}">${esc(state.plan.notes)}</textarea><div class="small" style="margin-top:8px">${t('local')}</div></div></section>${foot()}`;}
function renderProgress(){const st=stats();return `${head(t('progressTitle'),t('progressSub'))}${statCards()}${!st.seen?`<div class="card empty">${icon('chart')}<h2>${t('emptyProgress')}</h2><p>${t('emptyProgressSub')}</p>${nav(t('start'),'learn','book','btn')}</div>`:`<div class="two-col"><section class="card"><h2>${t('byTopic')}</h2>${THEMES.map(th=>{const s=themeStats(th.id),pct=Math.round(s.right/s.total*100);return `<div class="topic-row"><div class="theme-symbol">${icon(th.icon)}</div><div class="topic-copy"><strong>${t(th.title)}</strong><div class="progress-track" aria-label="${t(th.title)}"><div class="progress-fill" style="width:${pct}%"></div></div><small>${number(s.right)} / ${number(s.total)} ${t('correctAnswers')}</small></div><span class="percent">${number(pct)}%</span></div>`}).join('')}</section><section class="card"><h2>${t('toReview')}</h2><div class="big-number">${number(st.wrong)}</div><p class="muted" style="font-size:.91rem;margin-bottom:20px">${st.wrong?t('readyBody'):t('noErrors')}</p>${nav(t('errors'),'errors','refresh','btn full')}<hr class="divider"><h3>${t('retryPath')}</h3><p class="muted" style="font-size:.87rem;margin:10px 0 16px">${t('planSub')}</p>${nav(t('planActions'),'plan','exam','btn secondary full')}</section></div>`}<section class="card spacer-top"><h2 style="margin-bottom:14px">${t('recent')}</h2>${state.history.length?`<div style="overflow:auto"><table class="history-table"><thead><tr><th>${t('date')}</th><th>${t('mode')}</th><th>${t('score')}</th></tr></thead><tbody>${state.history.slice(0,10).map(h=>`<tr><td>${new Date(h.date).toLocaleDateString(language,{month:'short',day:'numeric'})}</td><td>${h.mode==='exam'?t('exam'):h.theme?t('theme'+h.theme):t('errors')}</td><td><b>${number(h.correct)} / ${number(h.total)}</b></td></tr>`).join('')}</tbody></table></div>`:`<p class="muted" style="font-size:.9rem">${t('emptyProgressSub')}</p>`}</section><div class="action-row spacer-top"><span class="small" style="flex:1">${t('local')}</span>${btn(t('reset'),'reset','danger small')}</div>${foot()}`;}
function renderErrors(){const ids=QUESTIONS.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);return `${head(t('errors'),t('readyBody'))}<div class="card ${!ids.length?'empty':''}">${!ids.length?`${icon('check')}<h2>${t('noErrors')}</h2><p>${t('noErrorsSub')}</p>${nav(t('train'),'learn','book','btn')}`:`<div class="section-head"><h2>${number(ids.length)} ${t('questions')} ${t('toReview').toLowerCase()}</h2>${btn(t('train'),'start-errors')}</div>${ids.map(q=>`<article class="review-item"><span class="tag navy">${t('theme'+q.theme)}</span><h3 style="margin-top:10px">${esc(data(q).q)}</h3></article>`).join('')}`}</div>`;}

function renderPage(){return ({prepare:renderPreparation,bde:renderBde,'bde-session':renderBdeSession,'bde-result':renderBdeResult,'bde-updates':renderBdeUpdates,home:renderHome,learn:renderLearn,lesson:renderLesson,quiz:renderQuiz,exam:renderExam,result:renderResult,practice:renderPractice,scenario:renderScenario,plan:renderPlan,progress:renderProgress,errors:renderErrors,help:renderHelp,access:renderAccess}[route]||renderHome)();}
function render(focus=false){document.documentElement.lang=language;document.documentElement.dir=language==='ar'?'rtl':'ltr';const gated=gateScreen();if(gated){document.title='FrancoRoute · '+(isAdminRoute()?'Administration':gt('gateTitle'));$('#app').innerHTML=gated;if(focus)window.scrollTo({top:0,behavior:'instant'});return;}document.title='FrancoRoute · '+t(navigation.find(n=>n[0]===currentNav())?.[1]||'help');$('#app').innerHTML=shell();if(gateNote==='ok'){gateNote='';setTimeout(()=>toast(gt('gateOk')),150);}if(focus){$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
const scenarioOrder={};
function readRoute(){consumeHashCode();mobileMore=false;const parts=location.hash.replace(/^#/,'').split('/');route=['prepare','bde','bde-session','bde-result','bde-updates','home','learn','lesson','quiz','exam','result','practice','scenario','plan','progress','errors','help','access'].includes(parts[0])?parts[0]:'home';detail=parts[1]||'';if(route==='scenario'&&!SCENARIOS.some(s=>s.id===detail))detail=SCENARIOS[0].id;if(route==='scenario'){scenarioSelection=null;scenarioAnswered=false;const q=byId(SCENARIOS.find(s=>s.id===detail)?.q);if(q)scenarioOrder[detail]=shuffle(q.data.fr.opts.map((_,i)=>i));}render(true);}
function go(path){if(location.hash==='#'+path){readRoute();}else location.hash=path;}
function toast(message){const el=$('#toast');if(!el)return;clearTimeout(toastTimer);el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>{if($('#toast'))$('#toast').hidden=true;},2700);}
let onConfirm=null;
function confirmDialog(title,body,label,fn){const d=$('#confirmDialog');$('#dialogTitle').textContent=title;$('#dialogBody').textContent=body;$('#dialogConfirm').textContent=label;onConfirm=fn;d.showModal();}
function requestSession(mode,ids,theme=null){const start=()=>{state.session={mode,ids,index:0,selected:null,feedback:false,answers:[],order:Object.fromEntries(ids.map(id=>[id,shuffle(byId(id).data.fr.opts.map((_,i)=>i))])),theme};persist();go('quiz');};if(state.session)confirmDialog(t('resetSession'),t('resetSessionBody'),t('newSession'),start);else start();}
function recordCurrent(){const s=state.session,q=byId(s.ids[s.index]);if(s.answers.some(a=>a.id===q.id))return;const correct=s.selected===q.data.fr.ans;const a={id:q.id,answer:s.selected,correct};s.answers.push(a);if(s.mode!=='exam')state.answers[q.id]={correct,answer:s.selected,date:new Date().toISOString()};}
function finishSession(){const s=state.session;for(const a of s.answers)state.answers[a.id]={correct:a.correct,answer:a.answer,date:new Date().toISOString()};state.lastResult={mode:s.mode,theme:s.theme,answers:s.answers,date:new Date().toISOString()};state.history.unshift({mode:s.mode,theme:s.theme,correct:s.answers.filter(a=>a.correct).length,total:s.answers.length,date:new Date().toISOString()});state.history=state.history.slice(0,40);state.session=null;persist();go('result');}
document.addEventListener('click',e=>{if(e.target.closest('.skip')){e.preventDefault();$('#main')?.focus();return;}const goBtn=e.target.closest('[data-go]');if(goBtn){go(goBtn.dataset.go);return;}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;
 if(action==='start-theme')requestSession('practice',shuffle(QUESTIONS.filter(q=>q.theme===Number(id)).map(q=>q.id)),Number(id));
 else if(action==='start-exam')requestSession('exam',[...shuffle(QUESTIONS.filter(q=>q.theme===1).map(q=>q.id)).slice(0,20),...shuffle(QUESTIONS.filter(q=>q.theme!==1).map(q=>q.id)).slice(0,20)]);
 else if(action==='resume')go('quiz');
 else if(action==='pause'){persist();go('home');setTimeout(()=>toast(t('resumeNote')),60);}
 else if(action==='choose'){state.session.selected=Number(id);persist();render();$(`[data-action="choose"][data-id="${id}"]`)?.focus({preventScroll:true});}
 else if(action==='validate'){if(state.session.selected===null)return;recordCurrent();state.session.feedback=true;persist();render();$('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
 else if(action==='next-question'){const s=state.session;if(!s||s.selected===null)return;recordCurrent();if(s.index===s.ids.length-1){finishSession();}else{s.index++;s.selected=null;s.feedback=false;persist();render(true);}}
 else if(action==='start-errors')requestSession('review',shuffle(QUESTIONS.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct).map(q=>q.id)));
 else if(action==='review-result')requestSession('review',shuffle(state.lastResult.answers.filter(a=>!a.correct).map(a=>a.id)));
 else if(action==='filter'){scenarioFilter=id;render();}
 else if(action==='scenario-choose'){scenarioSelection=Number(id);render();$(`[data-action="scenario-choose"][data-id="${id}"]`)?.focus({preventScroll:true});}
 else if(action==='scenario-validate'){if(scenarioSelection===null)return;scenarioAnswered=true;const sc=SCENARIOS.find(s=>s.id===detail);state.scenarioScores[detail]={correct:scenarioSelection===byId(sc.q).data.fr.ans,date:new Date().toISOString()};persist();render();$('.feedback')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
 else if(action==='add-plan'){if(!state.plan.issues.includes(id))state.plan.issues.push(id);persist();toast(t('planAdded'));}
 else if(action==='print'){persist();window.print();}
 else if(action==='reset')confirmDialog(t('resetTitle'),t('resetBody'),t('erase'),()=>{const lang=language;state=fresh();state.lang=lang;persist();render();toast(t('cleared'));});
 else if(action==='cancel-dialog'){$('#confirmDialog').close();onConfirm=null;}
});

document.addEventListener('change',e=>{if(e.target.id==='language'){language=e.target.value;state.lang=language;persist();render();}else if(e.target.dataset.issue){const id=e.target.dataset.issue;state.plan.issues=e.target.checked?[...new Set([...state.plan.issues,id])]:state.plan.issues.filter(x=>x!==id);persist();render();$(`[data-issue="${id}"]`)?.focus({preventScroll:true});}else if(e.target.dataset.status){state.plan.statuses[e.target.dataset.status]=Number(e.target.value);persist();toast(t('saved'));}});
document.addEventListener('input',e=>{if(e.target.id==='planNotes'){state.plan.notes=e.target.value;persist();}});

function h53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}

document.addEventListener('submit',e=>{
 const f=e.target.closest?.('[data-gate]');if(!f)return;e.preventDefault();
 const kind=f.dataset.gate,d=new FormData(f);
 if(kind==='code'){const res=activateCode(d.get('code'));if(res==='ok'){gateErr='';gateNote='ok';if(f.dataset.after==='stay')render(true);else go('home');}else{gateErr=res;render();}}
 else if(kind==='adminlogin'){if(h53(GATE.salt+'#admin#'+String(d.get('pw')||'').trim()).toString(36)===GATE.adminHash){adminUi.err='';lsSet(AKEY,'1');}else adminUi.err='Mot de passe incorrect.';render(true);}
 else if(kind==='gen'){adminUi.name=String(d.get('name')||'').trim();adminUi.phone=String(d.get('phone')||'').trim();adminUi.email=String(d.get('email')||'').trim();adminUi.link=String(d.get('link')||'').trim();
  if(!adminUi.name){adminUi.err='Entrez le prénom du client.';render();return;}
  adminUi.err='';const code=makeCode(adminUi.name);adminUi.gen={name:adminUi.name,code,msg:buildMsg(adminUi.name,code,adminUi.link)};addLog(adminUi.name,code);render();}
});
document.addEventListener('click',e=>{
 const b=e.target.closest?.('[data-gate-act]');if(!b)return;const a=b.dataset.gateAct;
 if(a==='copy'){copyText(adminUi.gen?.msg||'').then(ok=>toast(ok?'Message copié':'Copie impossible : sélectionnez le texte'));}
 else if(a==='adminout'){try{localStorage.removeItem(AKEY)}catch{}adminUi.gen=null;go('home');}
 else if(a==='again'){const row=readLog()[Number(b.dataset.i)];if(row){adminUi.name=row.n;adminUi.gen={name:row.n,code:row.c,msg:buildMsg(row.n,row.c,adminUi.link)};render(true);}}
});

window.addEventListener('hashchange',readRoute);
if(state.session&&(!Array.isArray(state.session.ids)||state.session.ids.some(id=>!byId(id))||state.session.index>=state.session.ids.length)){state.session=null;persist();}
readRoute();
