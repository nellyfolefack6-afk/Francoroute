      "q": "Aggressive driving is a type of [SELECT] driving behaviour that puts other driver’s safety and well-being at risk. It is the operation of a vehicle in an unsafe and hostile manner without regard for others.",
      "a": "intentional"
    },
    "fr": {
      "q": "La conduite agressive est décrite dans le cours comme un comportement de quelle nature ?",
      "a": "Intentionnelle."
    }

  {

    "number": 14,
    "page": 23,
    "en": {
      "q": "The term [SELECT] refers to the criminal offence of operating, having care or the control of a motor vehicle while the person's ability to operate the motor vehicle is impaired by alcohol and/or a drug.",
      "a": "impaired driving"
    },
    "fr": {
      "q": "Quel terme désigne la conduite lorsque l’alcool ou une drogue altère les capacités du conducteur ?",

    "page": 23,
    "en": {

    "fr": {
      "q": "Quels tests les policiers peuvent-ils utiliser pour rechercher des signes de facultés affaiblies ?",
      "a": "Des tests de sobriété."
    }

  {

    "page": 24,

    "fr": {
      "q": "Comment appelle-t-on la conduite accompagnée d’activités qui détournent l’attention de la route ?",

 desc1:['Reconnaître les formes, les couleurs et les messages.','Recognise shapes, colours and messages.','Reconocer formas, colores y mensajes.','تعرّف على الأشكال والألوان والرسائل.'],desc2:['Savoir quand attendre, céder et s’engager.','Know when to wait, yield and proceed.','Saber cuándo esperar, ceder y avanzar.','اعرف متى تنتظر وتعطي الأولوية وتتحرك.'],desc3:['Adapter sa vitesse et préparer ses manœuvres.','Adapt speed and prepare manoeuvres.','Adaptar la velocidad y preparar maniobras.','كيّف السرعة واستعد للمناورات.'],desc4:['Préparer le départ et rester disponible pour conduire.','Prepare to drive and stay alert.','Prepararse para conducir y mantenerse alerta.','استعد للقيادة وحافظ على اليقظة.'],desc5:['Protéger les piétons et comprendre les autres usagers.','Protect pedestrians and understand other road users.','Proteger a peatones y comprender a otros usuarios.','احمِ المشاة وافهم مستخدمي الطريق الآخرين.'],desc6:['S’insérer, garder ses distances et sortir en sécurité.','Merge, keep space and exit safely.','Incorporarse, mantener distancias y salir con seguridad.','اندمج وحافظ على المسافة واخرج بأمان.'],desc7:['Garder une marge quand les conditions changent.','Keep a safety margin as conditions change.','Mantener un margen cuando cambian las condiciones.','حافظ على هامش أمان عند تغير الظروف.'],

 lesson1:['Repérez la forme et la couleur, puis lisez le symbole ou le texte. Un panneau supplémentaire peut préciser une période ou une exception.','Notice the shape and colour, then read the symbol or text. An additional sign may specify times or exceptions.','Observe la forma y el color, luego el símbolo o texto. Una placa adicional puede indicar horarios o excepciones.','لاحظ الشكل واللون ثم اقرأ الرمز أو النص. قد تحدد لوحة إضافية أوقاتاً أو استثناءات.'],
 lesson2:['À une intersection, recherchez les piétons, les cyclistes et les véhicules. Respectez les arrêts et les priorités sans supposer que les autres vous ont vu.','At intersections, look for pedestrians, cyclists and vehicles. Obey stops and priority rules without assuming others have seen you.','En los cruces, busque peatones, ciclistas y vehículos. Respete paradas y prioridades sin suponer que otros le han visto.','عند التقاطعات ابحث عن المشاة والدراجات والمركبات. احترم التوقف والأولوية دون افتراض أن الآخرين رأوك.'],
 lesson3:['Une limite affichée est un maximum, pas une vitesse à atteindre à tout prix. Anticipez les virages, la visibilité et les changements de limite.','A posted limit is a maximum, not a target at any cost. Anticipate turns, visibility and changes in limits.','Un límite es un máximo, no una meta a cualquier precio. Anticipe giros, visibilidad y cambios de límite.','الحد المعلن أقصى سرعة وليس هدفاً بأي ثمن. توقع الانعطافات وتغير الرؤية والحدود.'],
 lesson4:['Préparez le siège, les rétroviseurs et la ceinture. Écartez les distractions. La fatigue, l’alcool, les drogues et certains médicaments peuvent altérer vos capacités.','Adjust your seat, mirrors and seat belt. Reduce distractions. Fatigue, alcohol, drugs and some medicines can impair your ability.','Ajuste asiento, espejos y cinturón. Reduzca distracciones. Fatiga, alcohol, drogas y ciertos medicamentos pueden alterar sus capacidades.','اضبط المقعد والمرايا والحزام وأبعد المشتتات. قد يؤثر التعب والكحول والمخدرات وبعض الأدوية في قدراتك.'],
 lesson5:['Gardez de l’espace autour des usagers vulnérables. Vérifiez avant de tourner ou d’ouvrir une portière. Prêtez attention aux signaux des autobus scolaires.','Leave space around vulnerable road users. Check before turning or opening a door. Watch school bus signals.','Deje espacio a usuarios vulnerables. Compruebe antes de girar o abrir una puerta. Observe las señales de los autobuses escolares.','اترك مساحة لمستخدمي الطريق الأكثر عرضة للخطر. تحقق قبل الانعطاف أو فتح الباب وانتبه لإشارات الحافلات المدرسية.'],
 lesson6:['Préparez votre insertion en observant la circulation et en ajustant votre vitesse sans dépasser la limite. Vérifiez vos angles morts. Une sortie manquée se corrige à la suivante.','Prepare to merge by checking traffic and adjusting speed without exceeding the limit. Check blind spots. Use the next exit if you miss yours.','Prepare la incorporación observando y ajustando la velocidad sin superar el límite. Revise ángulos muertos. Si pierde una salida, use la siguiente.','استعد للاندماج بمراقبة المرور وتكييف السرعة دون تجاوز الحد. افحص النقاط العمياء، وإذا فاتك مخرج فاستخدم التالي.'],
 lesson7:['Quand l’adhérence ou la visibilité diminue, réduisez la vitesse et augmentez l’espace. Évitez les gestes brusques et reportez le trajet si les conditions sont trop dangereuses.','When grip or visibility decreases, reduce speed and increase space. Avoid sudden inputs and delay travel if conditions are too dangerous.','Si baja la adherencia o visibilidad, reduzca y aumente el espacio. Evite movimientos bruscos y posponga el viaje si resulta demasiado peligroso.','عند ضعف التماسك أو الرؤية خفف السرعة وزد المسافة. تجنب الحركات المفاجئة وأجّل الرحلة إذا اشتد الخطر.'],
 lessonExtraTitle:['Dans la pratique','In practice','En la práctica','في التطبيق'],lessonExtra:['Lisez chaque situation jusqu’au bout. Cherchez le risque, vérifiez ce qui est permis, puis choisissez l’action la plus sûre.','Read each situation fully. Identify the risk, check what is allowed, then choose the safest action.','Lea toda la situación. Identifique el riesgo, compruebe lo permitido y elija la acción más segura.','اقرأ الموقف كاملاً وحدد الخطر وتحقق مما هو مسموح ثم اختر التصرف الأكثر أماناً.']

addRule(1,2,'traffic-lights',
['Le feu devient jaune. Que faire ?','S’arrêter si cela peut se faire en sécurité','Freiner brutalement dans tous les cas','Accélérer pour passer','Continuer sans vérifier','Au jaune, arrêtez-vous si cela est sécuritaire. Si l’arrêt ne peut se faire en sécurité, poursuivez avec prudence.'],
['The light turns amber. What should you do?','Stop if you can do so safely','Always brake sharply','Accelerate to get through','Continue without checking','Stop at amber if it is safe. If you cannot stop safely, proceed cautiously.'],
['El semáforo cambia a amarillo. ¿Qué debe hacer?','Detenerse si puede hacerlo con seguridad','Frenar bruscamente siempre','Acelerar para pasar','Continuar sin comprobar','Deténgase si puede hacerlo con seguridad. Si no, continúe con prudencia.'],
['تحولت الإشارة إلى الأصفر. ماذا تفعل؟','أتوقف إذا كان ذلك آمناً','أفرمل بشدة في كل الحالات','أزيد السرعة للعبور','أتابع دون التحقق','توقف إذا أمكنك ذلك بأمان. وإلا فتابع بحذر.']);
addRule(2,2,'traffic-lights',
['Quand peut-on tourner à droite au feu rouge ?','Après arrêt complet, si permis et si la voie est libre','Sans arrêt si personne n’arrive','Toujours, même avec une interdiction','Uniquement après un coup de klaxon','Respectez les interdictions affichées. Après l’arrêt, cédez le passage aux piétons et à la circulation.'],
['When may you turn right on red?','After a full stop, if allowed and the way is clear','Without stopping if no one approaches','Always, even when prohibited','Only after sounding the horn','Obey any restriction. After stopping, yield to pedestrians and traffic.'],
['¿Cuándo puede girar a la derecha con luz roja?','Tras detenerse, si está permitido y la vía está libre','Sin parar si no viene nadie','Siempre, aunque esté prohibido','Sólo después de tocar la bocina','Respete las prohibiciones. Tras parar, ceda el paso a peatones y vehículos.'],
['متى يمكن الانعطاف يميناً عند الأحمر؟','بعد توقف كامل، إذا كان مسموحاً والطريق خالياً','دون توقف إذا لم يقترب أحد','دائماً حتى مع وجود منع','بعد استعمال المنبه فقط','احترم لوحات المنع. بعد التوقف أعطِ الأولوية للمشاة والمركبات.']);
addRule(3,2,'traffic-lights',
['Le feu passe au vert, mais un piéton termine sa traversée. Que faire ?','Attendre que le passage soit libre','Démarrer car le feu est vert','Contourner le piéton','Klaxonner pour le presser','Un feu vert ne donne pas une priorité absolue. Laissez les usagers déjà engagés dégager le passage.'],
['The light turns green while a pedestrian is still crossing. What do you do?','Wait until the way is clear','Go because the light is green','Drive around the pedestrian','Honk to hurry them','Green is not absolute priority. Let road users already crossing clear your path.'],
['La luz pasa a verde y un peatón sigue cruzando. ¿Qué hace?','Esperar a que el paso esté libre','Avanzar porque está verde','Rodear al peatón','Tocar la bocina para apurarlo','La luz verde no da prioridad absoluta. Deje que quienes ya cruzan despejen el paso.'],
['أصبحت الإشارة خضراء وما زال أحد المشاة يعبر. ماذا تفعل؟','أنتظر حتى يخلو المسار','أنطلق لأن الإشارة خضراء','ألتف حوله','أستعمل المنبه لاستعجاله','الإشارة الخضراء لا تعطي أولوية مطلقة. دع من بدأ العبور يُخلي المسار.']);
addRule(4,2,'driving-through-intersections',
['À un arrêt à quatre directions, vous arrivez après un autre véhicule. Qui passe d’abord ?','Le véhicule qui s’est arrêté en premier','Le plus gros véhicule','Vous, si vous allez tout droit','Celui qui klaxonne','Après votre arrêt complet, cédez au véhicule arrêté avant vous. Vérifiez aussi les piétons.'],
['At a four-way stop, you arrive after another vehicle. Who goes first?','The vehicle that stopped first','The larger vehicle','You, if going straight','Whoever honks','After stopping fully, yield to the vehicle that stopped before you. Check for pedestrians too.'],
['En un cruce con cuatro STOP, llega después de otro vehículo. ¿Quién pasa primero?','El que se detuvo primero','El vehículo más grande','Usted, si va recto','Quien toque la bocina','Tras detenerse por completo, ceda al vehículo que llegó antes. Compruebe también los peatones.'],
['وصلت بعد مركبة أخرى إلى تقاطع توقف رباعي. من يمر أولاً؟','المركبة التي توقفت أولاً','المركبة الأكبر','أنا إذا كنت أسير مباشرة','من يستعمل المنبه','بعد التوقف الكامل، أعطِ الأولوية للمركبة التي توقفت قبلك وانتبه للمشاة.']);
addRule(5,2,'driving-through-intersections',
['Deux véhicules arrivent ensemble à un arrêt à quatre directions. L’autre est à votre droite. Que faire ?','Lui céder le passage','Passer avant lui','Accélérer pour départager','Attendre un feu vert','En cas d’arrivée simultanée, cédez au véhicule à votre droite. Ne forcez jamais le passage.'],
['Two vehicles reach a four-way stop together. The other is on your right. What do you do?','Yield to it','Go first','Accelerate to decide','Wait for a green light','When arrival is simultaneous, yield to the vehicle on your right. Never force your way through.'],
['Dos vehículos llegan a la vez a un STOP de cuatro vías. El otro está a su derecha. ¿Qué hace?','Cederle el paso','Pasar primero','Acelerar para decidir','Esperar una luz verde','Si llegan al mismo tiempo, ceda al vehículo a su derecha. Nunca fuerce el paso.'],
['وصلت مركبتان معاً إلى توقف رباعي والأخرى على يمينك. ماذا تفعل؟','أعطيها الأولوية','أمر أولاً','أزيد السرعة لحسم الأمر','أنتظر ضوءاً أخضر','عند الوصول معاً، أعطِ الأولوية للمركبة على يمينك ولا تفرض مرورك.']);
addRule(6,2,'changing-directions',
['Avant d’entrer dans un carrefour giratoire, vous devez :','Céder aux véhicules déjà dans l’anneau','Obliger les véhicules dans l’anneau à s’arrêter','Entrer à gauche du terre-plein central','Vous arrêter systématiquement même si tout est libre','Ralentissez, choisissez votre voie avant l’entrée et cédez à la circulation déjà engagée.'],
['Before entering a roundabout, you must:','Yield to traffic already circulating','Make circulating vehicles stop','Enter left of the centre island','Always stop even when clear','Slow down, choose your lane before entering and yield to circulating traffic.'],
['Antes de entrar en una rotonda debe:','Ceder a los vehículos que ya circulan dentro','Obligarlos a parar','Entrar por la izquierda de la isleta central','Parar siempre aunque esté libre','Reduzca la velocidad, elija su carril antes de entrar y ceda a quienes circulan dentro.'],
['قبل دخول الدوار يجب أن:','تعطي الأولوية للمركبات الموجودة فيه','تجبر المركبات داخله على التوقف','تدخل من يسار الجزيرة المركزية','تتوقف دائماً حتى لو كان خالياً','خفف السرعة واختر المسار قبل الدخول وأعطِ الأولوية للمركبات داخل الدوار.']);
addRule(7,2,'traffic-lights',
['Au feu vert fixe, vous tournez à gauche face à un véhicule qui va tout droit. Que faire ?','Céder au véhicule venant en face','Tourner immédiatement','Passer en premier grâce au vert','Lui demander de s’arrêter','Sans flèche protégée, attendez une ouverture sécuritaire et cédez aux usagers dont vous croisez le trajet.'],
['At a solid green light, you turn left across an oncoming vehicle going straight. What do you do?','Yield to the oncoming vehicle','Turn immediately','Go first because the light is green','Ask it to stop','Without a protected arrow, wait for a safe gap and yield to users whose paths you cross.'],
['Con luz verde fija gira a la izquierda frente a un vehículo que sigue recto. ¿Qué hace?','Ceder al vehículo de frente','Girar inmediatamente','Pasar primero porque está verde','Pedirle que pare','Sin una flecha protegida, espere un espacio seguro y ceda a quienes cruzan su trayectoria.'],
['تنعطف يساراً عند ضوء أخضر ثابت ومركبة مقابلة تسير مباشرة. ماذا تفعل؟','أعطي المركبة المقابلة الأولوية','أنعطف فوراً','أمر أولاً لأن الضوء أخضر','أطلب منها التوقف','دون سهم محمي، انتظر فرصة آمنة وأعطِ الأولوية لمن تقطع مسارهم.']);
addRule(8,2,'stopping',
['Un panneau STOP et une ligne d’arrêt sont présents. Où s’arrêter ?','Avant la ligne, sans la dépasser','Sur le passage piéton','Après la ligne pour mieux voir','Seulement si une voiture arrive','Immobilisez complètement les roues avant la ligne. Observez, puis avancez seulement lorsque cela est sécuritaire.'],
['There is a STOP sign and a stop line. Where do you stop?','Before the line without crossing it','On the crosswalk','Past the line for a better view','Only if a vehicle approaches','Bring the wheels to a complete stop before the line. Check, then proceed only when safe.'],
['Hay una señal STOP y una línea de detención. ¿Dónde para?','Antes de la línea, sin rebasarla','Sobre el paso peatonal','Después de la línea para ver mejor','Sólo si viene un vehículo','Detenga por completo las ruedas antes de la línea. Observe y avance sólo cuando sea seguro.'],
['توجد علامة توقف وخط توقف. أين تتوقف؟','قبل الخط دون تجاوزه','على ممر المشاة','بعد الخط لتحسين الرؤية','فقط إذا اقتربت مركبة','أوقف العجلات تماماً قبل الخط، ثم تحقق ولا تتحرك إلا عندما يكون ذلك آمناً.']);
addRule(9,2,'driving-along',
['Un policier dirige la circulation et vous demande de vous arrêter malgré le feu vert. Que faire ?','Suivre les indications du policier','Suivre uniquement le feu','Passer en klaxonnant','Demander aux autres conducteurs','Les indications d’un policier qui dirige la circulation priment sur les feux et les panneaux.'],
['An officer directing traffic tells you to stop despite a green light. What do you do?','Follow the officer’s directions','Follow only the light','Drive through while honking','Ask other drivers','Directions from an officer controlling traffic take priority over lights and signs.'],
['Un agente dirige el tráfico y le indica parar aunque está verde. ¿Qué hace?','Seguir las indicaciones del agente','Obedecer sólo el semáforo','Pasar tocando la bocina','Preguntar a otros conductores','Las indicaciones del agente que dirige el tráfico tienen prioridad sobre señales y semáforos.'],
['شرطي ينظم المرور يطلب منك التوقف رغم الضوء الأخضر. ماذا تفعل؟','أتبع تعليمات الشرطي','أتبع الضوء فقط','أعبر مع استعمال المنبه','أسأل السائقين الآخرين','تعليمات شرطي المرور مقدمة على الإشارات واللوحات.']);
addRule(10,2,'driving-through-intersections',
['Le feu est vert, mais la circulation bloque la sortie du carrefour. Que faire ?','Attendre avant d’entrer','Entrer puis attendre au milieu','Klaxonner pour avancer','Utiliser le passage piéton','N’entrez pas si vous risquez de bloquer l’intersection. Attendez de pouvoir la dégager.'],
['The light is green but traffic blocks the far side of the intersection. What do you do?','Wait before entering','Enter and wait in the middle','Honk to move forward','Use the crosswalk','Do not enter if you could block the intersection. Wait until you can clear it.'],
['Está verde, pero el tráfico bloquea la salida del cruce. ¿Qué hace?','Esperar antes de entrar','Entrar y esperar en medio','Tocar la bocina para avanzar','Usar el paso peatonal','No entre si puede bloquear el cruce. Espere hasta poder despejarlo.'],
['الضوء أخضر لكن الازدحام يسد مخرج التقاطع. ماذا تفعل؟','أنتظر قبل الدخول','أدخل وأنتظر في الوسط','أستعمل المنبه للتقدم','أستخدم ممر المشاة','لا تدخل إذا كنت ستغلق التقاطع. انتظر حتى تتمكن من إخلائه.']);
addRule(11,3,'signs',
['En zone scolaire, comment connaître la limite applicable ?','Lire les panneaux, les heures et les feux éventuels','Supposer toujours 40 km/h','Appliquer toujours 50 km/h','Suivre le véhicule devant','Il n’existe pas une seule limite pour toutes les zones scolaires. Respectez la signalisation applicable.'],
['How do you determine the speed limit in a school zone?','Read the signs, times and any flashing lights','Always assume 40 km/h','Always use 50 km/h','Follow the car ahead','There is no single limit for every school zone. Follow the applicable signs.'],
['¿Cómo conoce el límite en una zona escolar?','Lee las señales, horarios y luces si las hay','Supone siempre 40 km/h','Aplica siempre 50 km/h','Sigue al vehículo de delante','No hay un límite único para todas las zonas escolares. Respete la señalización aplicable.'],
['كيف تعرف حد السرعة في منطقة مدرسية؟','أقرأ اللوحات والأوقات والأضواء إن وجدت','أفترض دائماً 40 كم/س','ألتزم دائماً بـ50 كم/س','أتبع المركبة أمامي','لا يوجد حد واحد لجميع المناطق المدرسية. اتبع الإشارات السارية.']);
addRule(12,3,'freeway-driving',
['Comment connaître la limite sur une autoroute ontarienne ?','Suivre la limite affichée sur le tronçon','Supposer toujours 100 km/h','Rouler à la vitesse du véhicule le plus rapide','Ajouter 10 km/h à la limite','Les limites varient selon le tronçon. La vitesse de la circulation n’autorise pas un dépassement de la limite.'],
['How do you know the speed limit on an Ontario freeway?','Follow the posted limit for that section','Always assume 100 km/h','Match the fastest vehicle','Add 10 km/h to the limit','Limits vary by section. Traffic speed does not authorize exceeding the limit.'],
['¿Cómo sabe el límite en una autopista de Ontario?','Respeta el límite indicado en ese tramo','Supone siempre 100 km/h','Iguala al vehículo más rápido','Añade 10 km/h al límite','Los límites varían por tramo. La velocidad del tráfico no permite superar el límite.'],
['كيف تعرف حد السرعة على طريق سريع في أونتاريو؟','أتبع الحد المعلن في المقطع','أفترض دائماً 100 كم/س','أساير أسرع مركبة','أضيف 10 كم/س إلى الحد','تختلف الحدود حسب المقطع. سرعة الآخرين لا تبرر تجاوز الحد.']);
addRule(13,3,'driving-along',
['Dans une ville, sans autre limite applicable, la limite générale est :','50 km/h','30 km/h dans tous les cas','80 km/h','100 km/h','La limite générale en ville est de 50 km/h, sauf indication contraire. Vérifiez les panneaux d’entrée de secteur.'],
['In a city, with no other applicable limit, the general speed limit is:','50 km/h','Always 30 km/h','80 km/h','100 km/h','The general urban limit is 50 km/h unless otherwise posted. Check area-entry signs too.'],
['En una ciudad, sin otro límite aplicable, el límite general es:','50 km/h','Siempre 30 km/h','80 km/h','100 km/h','El límite urbano general es de 50 km/h salvo indicación contraria. Revise también las señales de entrada de zona.'],
['داخل مدينة، إذا لم يوجد حد آخر سارٍ، فالحد العام هو:','50 كم/س','30 كم/س دائماً','80 كم/س','100 كم/س','الحد العام داخل المدن 50 كم/س ما لم يُحدد غير ذلك. انتبه للوحات مداخل المناطق أيضاً.']);
addRule(14,3,'driving-along',
['Hors des villes et villages, sans autre limite applicable, la limite générale est :','80 km/h','50 km/h','110 km/h','Aucune limite','La limite générale hors des villes et villages est de 80 km/h, sauf signalisation contraire.'],
['Outside cities and towns, with no other applicable limit, the general limit is:','80 km/h','50 km/h','110 km/h','No limit','The general limit outside cities and towns is 80 km/h unless otherwise posted.'],
['Fuera de ciudades y pueblos, sin otro límite aplicable, el límite general es:','80 km/h','50 km/h','110 km/h','Sin límite','El límite general fuera de ciudades y pueblos es de 80 km/h salvo señalización contraria.'],
['خارج المدن والبلدات، إذا لم يوجد حد آخر سارٍ، فالحد العام هو:','80 كم/س','50 كم/س','110 كم/س','لا يوجد حد','الحد العام خارج المدن والبلدات 80 كم/س ما لم تحدد اللوحات غير ذلك.']);
addRule(15,3,'changing-directions',
['Vous préparez un virage. Quand réduire votre vitesse ?','Progressivement avant le virage','Seulement au milieu du virage','Après avoir tourné','Jamais si la route est libre','Anticipez et réduisez avant de tourner. Gardez une vitesse adaptée et une trajectoire maîtrisée.'],
['You are preparing for a turn. When should you reduce speed?','Gradually before the turn','Only halfway through','After turning','Never if the road is clear','Anticipate and slow before turning. Maintain suitable speed and control of your path.'],
['Se prepara para girar. ¿Cuándo reduce la velocidad?','Gradualmente antes del giro','Sólo a mitad del giro','Después de girar','Nunca si está libre','Anticipe y reduzca antes de girar. Mantenga una velocidad adecuada y controle la trayectoria.'],
['تستعد للانعطاف. متى تخفف السرعة؟','تدريجياً قبل الانعطاف','في منتصف الانعطاف فقط','بعد الانعطاف','لا أخفف إذا كان الطريق خالياً','توقع الانعطاف وخفف قبله، وحافظ على سرعة مناسبة ومسار مضبوط.']);
addRule(16,3,'driving-along',
['Rouler très lentement sans raison sur une route dégagée est-il toujours plus sûr ?','Non, il faut une vitesse adaptée sans gêner inutilement','Oui, plus lent est toujours mieux','Oui, même en bloquant tout le monde','Non, il faut dépasser la limite','Respectez la limite et adaptez-vous aux conditions. Une lenteur injustifiée peut aussi perturber la circulation.'],
['Is driving very slowly for no reason on a clear road always safer?','No, use an appropriate speed without unnecessary obstruction','Yes, slower is always better','Yes, even when blocking everyone','No, you should exceed the limit','Follow the limit and conditions. Unjustified slow driving can also disrupt traffic.'],
['¿Circular muy despacio sin motivo en una vía despejada es siempre más seguro?','No, adapte la velocidad sin obstaculizar innecesariamente','Sí, cuanto más lento mejor','Sí, aunque bloquee a todos','No, debe superar el límite','Respete el límite y las condiciones. Una lentitud injustificada también puede perturbar el tráfico.'],
['هل القيادة البطيئة جداً بلا سبب على طريق خالٍ أكثر أماناً دائماً؟','لا، اختر سرعة مناسبة دون إعاقة غير ضرورية','نعم، الأبطأ أفضل دائماً','نعم حتى لو أعقت الجميع','لا، يجب تجاوز الحد','احترم الحد والظروف. البطء غير المبرر قد يعرقل حركة المرور أيضاً.']);
addRule(17,3,'dealing-particular-situations',
['Une zone de travaux affiche une limite temporaire. Que faire ?','Respecter cette limite et les indications du signaleur','L’ignorer sans ouvrier visible','Suivre uniquement le GPS','Accélérer pour quitter la zone','La signalisation temporaire s’applique. Anticipez les travailleurs, les voies réduites et les changements de trajet.'],
['A work zone has a temporary speed limit. What should you do?','Follow it and the traffic-control person’s directions','Ignore it when no worker is visible','Follow only your GPS','Speed up to leave the zone','Temporary signs apply. Anticipate workers, narrow lanes and changes in route.'],
['Una zona de obras tiene un límite temporal. ¿Qué hace?','Respetarlo y seguir al señalista','Ignorarlo si no ve trabajadores','Seguir sólo el GPS','Acelerar para salir de la zona','La señalización temporal se aplica. Anticipe trabajadores, carriles estrechos y desvíos.'],
['توجد سرعة مؤقتة في منطقة أشغال. ماذا تفعل؟','ألتزم بها وبتعليمات منظم المرور','أتجاهلها إذا لم أرَ عمالاً','أتبع جهاز الملاحة فقط','أسرع للخروج من المنطقة','الإشارات المؤقتة سارية. توقع العمال وضيق المسارات وتغير الطريق.']);
addRule(18,4,'dealing-particular-situations',
['Vous attendez au feu rouge. Pouvez-vous lire un message sur un téléphone tenu en main ?','Non, l’interdiction s’applique aussi à l’arrêt dans la circulation','Oui, tant que les roues ne bougent pas','Oui, pour un message court','Oui, avec les feux de détresse','Attendez d’être stationné légalement et en sécurité. Un arrêt au feu rouge ne permet pas l’usage du téléphone en main.'],
['While stopped at a red light, may you read a message on a hand-held phone?','No, the restriction also applies while stopped in traffic','Yes, if the wheels are still','Yes, for a short message','Yes, with hazard lights on','Wait until safely and legally parked. A red light does not allow hand-held phone use.'],
['En un semáforo rojo, ¿puede leer un mensaje con el teléfono en la mano?','No, la prohibición también rige al detenerse en el tráfico','Sí, si las ruedas están quietas','Sí, si es corto','Sí, con luces de emergencia','Espere a estar estacionado legalmente y con seguridad. El rojo no permite usar el móvil en la mano.'],
['أثناء التوقف عند الأحمر، هل تقرأ رسالة والهاتف بيدك؟','لا، المنع يشمل التوقف ضمن حركة المرور','نعم إذا كانت العجلات ساكنة','نعم إذا كانت الرسالة قصيرة','نعم مع أضواء التحذير','انتظر حتى تركن قانونياً وبأمان. التوقف عند الأحمر لا يسمح باستخدام الهاتف باليد.']);
addRule(19,4,'getting-ready-drive',
['Un médicament peut causer de la somnolence. Que faire avant de conduire ?','Vérifier les effets avec un pharmacien ou un médecin','Supposer qu’une ordonnance garantit la sécurité','Boire du café pour compenser','Doubler la dose pour finir plus vite','Les médicaments peuvent altérer la vigilance. Ne conduisez pas si vos capacités sont diminuées.'],
['A medicine may cause drowsiness. What should you do before driving?','Check its effects with a pharmacist or doctor','Assume a prescription guarantees safety','Drink coffee to compensate','Double the dose to finish sooner','Medicines can affect alertness. Do not drive if your ability is impaired.'],
['Un medicamento puede causar sueño. ¿Qué hace antes de conducir?','Consultar sus efectos con un farmacéutico o médico','Suponer que una receta garantiza seguridad','Tomar café para compensar','Duplicar la dosis','Los medicamentos pueden reducir la atención. No conduzca si sus capacidades están alteradas.'],
['قد يسبب دواء النعاس. ماذا تفعل قبل القيادة؟','أتحقق من آثاره مع الصيدلي أو الطبيب','أفترض أن الوصفة تضمن الأمان','أشرب القهوة للتعويض','أضاعف الجرعة','قد تؤثر الأدوية في اليقظة. لا تقد إذا تأثرت قدراتك.']);
addRule(20,4,'getting-your-drivers-licence',
['Un conducteur de 21 ans avec un permis G complet peut-il avoir de l’alcool dans le sang au volant ?','Non, la tolérance zéro s’applique à 21 ans et moins','Oui, puisqu’il a le permis G','Oui, après un repas','Oui, sur un trajet court','La tolérance zéro vise les conducteurs de 21 ans et moins, ainsi que les titulaires G1 et G2.'],
['May a 21-year-old full G driver have alcohol in their blood while driving?','No, zero alcohol applies at age 21 and under','Yes, because they hold a G licence','Yes, after a meal','Yes, on a short trip','Zero alcohol applies to drivers aged 21 and under, and to G1 and G2 drivers.'],
['¿Un conductor de 21 años con permiso G completo puede tener alcohol en sangre al conducir?','No, la tolerancia cero rige hasta los 21 años inclusive','Sí, porque tiene permiso G','Sí, después de comer','Sí, en un trayecto corto','La tolerancia cero se aplica hasta los 21 años inclusive y a conductores G1 y G2.'],
['هل يُسمح لسائق عمره 21 عاماً ويحمل G كاملاً بوجود كحول في دمه أثناء القيادة؟','لا، شرط الصفر يشمل عمر 21 عاماً وما دونه','نعم لأنه يحمل G','نعم بعد وجبة','نعم في رحلة قصيرة','شرط انعدام الكحول يشمل من عمرهم 21 عاماً وما دون، وحاملي G1 وG2.']);
addRule(21,4,'getting-ready-drive',
['Avant de démarrer, que faut-il vérifier ?','Siège, rétroviseurs, ceinture et environnement','Seulement le niveau de carburant','Uniquement le téléphone','La musique avant les rétroviseurs','Préparez votre poste de conduite et vérifiez que le départ est sécuritaire avant de bouger.'],
['What should you check before moving off?','Seat, mirrors, seat belt and surroundings','Only the fuel level','Only your phone','Music before mirrors','Set up your driving position and check that it is safe to move before starting.'],
['¿Qué comprueba antes de iniciar la marcha?','Asiento, espejos, cinturón y entorno','Sólo el combustible','Sólo el teléfono','La música antes que los espejos','Prepare su posición de conducción y compruebe que puede iniciar la marcha con seguridad.'],
['ماذا تتحقق منه قبل الانطلاق؟','المقعد والمرايا والحزام والمحيط','مستوى الوقود فقط','الهاتف فقط','الموسيقى قبل المرايا','اضبط وضعية القيادة وتحقق من أمان الانطلاق قبل التحرك.']);
addRule(22,4,'dealing-particular-situations',
['Vous bâillez et avez du mal à garder les yeux ouverts. Que faire ?','Trouver un endroit sûr pour s’arrêter et se reposer','Ouvrir la fenêtre et continuer','Monter la musique','Accélérer pour arriver plus vite','La somnolence compromet la conduite. Le bruit et l’air frais ne remplacent pas le repos.'],
['You are yawning and struggling to keep your eyes open. What do you do?','Find a safe place to stop and rest','Open a window and continue','Turn up the music','Speed up to arrive sooner','Drowsiness affects driving. Noise and fresh air do not replace rest.'],
['Bosteza y le cuesta mantener los ojos abiertos. ¿Qué hace?','Busca un lugar seguro para parar y descansar','Abre la ventana y sigue','Sube la música','Acelera para llegar antes','La somnolencia afecta la conducción. El ruido y el aire fresco no sustituyen el descanso.'],
['تتثاءب وتجد صعوبة في إبقاء عينيك مفتوحتين. ماذا تفعل؟','أجد مكاناً آمناً للتوقف والراحة','أفتح النافذة وأتابع','أرفع صوت الموسيقى','أسرع للوصول','النعاس يؤثر في القيادة. الضجيج والهواء لا يعوضان الراحة.']);
addRule(23,4,'dealing-particular-situations',
['Vous devez régler votre GPS. Quelle est la meilleure préparation ?','Régler l’itinéraire avant de partir','Le saisir en roulant lentement','Le tenir au volant','Demander au conducteur derrière d’attendre','Préparez votre trajet avant le départ. Si nécessaire, stationnez en sécurité pour modifier les réglages.'],
['You need to set your GPS. What is the best preparation?','Set the route before leaving','Type it while driving slowly','Hold it at the wheel','Ask the driver behind to wait','Prepare your route before setting off. Park safely if you need to change settings.'],
['Necesita configurar el GPS. ¿Cuál es la mejor preparación?','Introducir la ruta antes de salir','Escribirla mientras conduce despacio','Sostenerlo al volante','Pedir al conductor de atrás que espere','Prepare la ruta antes de salir. Estacione con seguridad si necesita cambiarla.'],
['تحتاج إلى إعداد الملاحة. ما أفضل استعداد؟','أحدد الطريق قبل الانطلاق','أكتب أثناء القيادة ببطء','أحمله عند المقود','أطلب ممن خلفي الانتظار','جهز الطريق قبل الانطلاق. اركن بأمان عند الحاجة لتغيير الإعدادات.']);
addRule(24,4,'getting-ready-drive',
['Les aides électroniques remplacent-elles l’attention du conducteur ?','Non, le conducteur reste responsable','Oui, si la voiture est récente','Oui, avec une caméra','Oui, sur une route connue','Connaissez les limites des aides. Continuez à observer et soyez prêt à reprendre le contrôle.'],
['Do electronic driving aids replace the driver’s attention?','No, the driver remains responsible','Yes, if the car is new','Yes, with a camera','Yes, on a familiar road','Know the aids’ limits. Keep observing and be ready to take control.'],
['¿Las ayudas electrónicas sustituyen la atención del conductor?','No, el conductor sigue siendo responsable','Sí, si el coche es nuevo','Sí, con una cámara','Sí, en una ruta conocida','Conozca sus límites. Siga observando y esté preparado para tomar el control.'],
['هل تعوض المساعدات الإلكترونية انتباه السائق؟','لا، يبقى السائق مسؤولاً','نعم إذا كانت السيارة حديثة','نعم مع وجود كاميرا','نعم على طريق مألوف','اعرف حدود المساعدات، وواصل المراقبة واستعد للتحكم.']);
addRule(25,4,'getting-your-drivers-licence',
['Vous avez consommé du cannabis et vous sentez ralenti. Que faire ?','Ne pas conduire et prévoir un autre transport','Conduire car le cannabis est légal','Prendre une route moins fréquentée','Boire un café puis partir','La légalité d’un produit ne rend pas la conduite avec facultés affaiblies acceptable. Prévoyez un transport sûr.'],
['You have used cannabis and feel slowed down. What should you do?','Do not drive; arrange other transport','Drive because cannabis is legal','Use a quieter road','Drink coffee and leave','A legal substance does not make impaired driving acceptable. Arrange safe transport.'],
['Ha consumido cannabis y se siente lento. ¿Qué hace?','No conducir y buscar otro transporte','Conducir porque es legal','Usar una vía menos transitada','Tomar café y salir','Que una sustancia sea legal no permite conducir con las capacidades alteradas. Busque transporte seguro.'],
['استهلكت القنب وتشعر ببطء الاستجابة. ماذا تفعل؟','لا أقود وأرتب وسيلة نقل أخرى','أقود لأنه قانوني','أسلك طريقاً أقل ازدحاماً','أشرب القهوة وأنطلق','قانونية المادة لا تبيح القيادة مع تأثر القدرات. رتب نقلاً آمناً.']);
addRule(26,5,'stopping',
['Un autobus scolaire est arrêté, feux rouges clignotants, sur une route sans terre-plein séparateur. Qui doit s’arrêter ?','Les véhicules dans les deux sens','Seulement ceux derrière','Seulement les voitures','Personne si aucun enfant n’est visible','Les deux sens doivent s’arrêter. Ne repartez pas tant que les signaux restent actifs et que la voie n’est pas libre.'],
['A school bus is stopped with red lights flashing on a road without a median. Who must stop?','Vehicles in both directions','Only those behind','Only cars','No one if no child is visible','Traffic in both directions must stop. Do not proceed while signals remain active or the way is not clear.'],
['Un autobús escolar está parado con luces rojas intermitentes en una vía sin mediana. ¿Quién para?','Los vehículos en ambos sentidos','Sólo quienes van detrás','Sólo los coches','Nadie si no se ven niños','Deben parar ambos sentidos. No avance mientras las señales sigan activas o el paso no esté libre.'],
['حافلة مدرسية متوقفة وأضواؤها الحمراء تومض على طريق دون حاجز وسطي. من يتوقف؟','المركبات في الاتجاهين','من خلفها فقط','السيارات فقط','لا أحد إذا لم يظهر أطفال','يجب توقف الاتجاهين. لا تنطلق مع استمرار الإشارات أو قبل خلو الطريق.']);
addRule(27,5,'stopping',
['Une barrière physique sépare votre chaussée de celle d’un autobus scolaire arrêté en face. Qui doit s’arrêter pour ses feux rouges ?','Les véhicules derrière l’autobus sur sa chaussée','Tous les véhicules des deux chaussées','Uniquement les véhicules qui le croisent','Personne','Un terre-plein physique change la règle : les véhicules qui arrivent derrière le bus doivent s’arrêter. Une ligne peinte ne suffit pas.'],
['A physical median separates you from a school bus stopped on the opposite carriageway. Who must stop for its red lights?','Vehicles approaching from behind the bus','All vehicles on both carriageways','Only oncoming vehicles','No one','With a physical median, vehicles approaching from behind the bus must stop. A painted line is not a median.'],
['Una barrera física separa su calzada de un autobús escolar detenido enfrente. ¿Quién debe parar por sus luces rojas?','Los vehículos que se aproximan por detrás del autobús','Todos en ambas calzadas','Sólo quienes vienen de frente','Nadie','Con mediana física, deben parar quienes llegan por detrás del autobús. Una línea pintada no es una mediana.'],
['يفصل حاجز مادي طريقك عن حافلة مدرسية متوقفة في الاتجاه المقابل. من يتوقف لأضوائها الحمراء؟','المركبات التي تقترب من خلف الحافلة','الجميع على الطريقين','القادمون من الأمام فقط','لا أحد','مع حاجز وسطي مادي، يتوقف القادمون من خلف الحافلة. الخط المرسوم ليس حاجزاً مادياً.']);
addRule(28,5,'sharing-road-other-road-users',
['Les feux jaunes supérieurs d’un autobus scolaire clignotent. Que faire ?','Ralentir et se préparer à s’arrêter','Accélérer pour le dépasser','Klaxonner','Ignorer jusqu’à voir un enfant','Les feux jaunes annoncent que l’autobus se prépare à s’arrêter. Anticipez l’arrêt et surveillez les enfants.'],
['A school bus’s upper amber lights are flashing. What should you do?','Slow down and prepare to stop','Speed up to pass','Honk','Ignore them until you see a child','Amber lights warn that the bus is preparing to stop. Anticipate the stop and watch for children.'],
['Parpadean las luces amarillas superiores de un autobús escolar. ¿Qué hace?','Reducir y prepararse para parar','Acelerar para adelantar','Tocar la bocina','Ignorarlas hasta ver un niño','Las luces amarillas avisan que el autobús va a detenerse. Anticipe la parada y vigile a los niños.'],
['تومض الأضواء الصفراء العلوية لحافلة مدرسية. ماذا تفعل؟','أخفف السرعة وأستعد للتوقف','أسرع لتجاوزها','أستعمل المنبه','أتجاهلها حتى أرى طفلاً','الأضواء الصفراء تعني استعداد الحافلة للتوقف. توقع ذلك وانتبه للأطفال.']);
addRule(29,5,'sharing-road-other-road-users',
['Pour dépasser un cycliste, quel espace faut-il laisser lorsque cela est possible ?','Au moins un mètre','Quelques centimètres','Aucun si vous klaxonnez','La largeur du rétroviseur','Laissez au moins un mètre lorsque cela est possible. Si le dépassement n’est pas sûr, attendez.'],
['When passing a cyclist, how much space must you leave where practicable?','At least one metre','A few centimetres','None if you honk','One mirror’s width','Leave at least one metre where practicable. Wait if you cannot pass safely.'],
['Al adelantar a un ciclista, ¿qué espacio deja cuando sea posible?','Al menos un metro','Unos centímetros','Ninguno si toca la bocina','El ancho de un espejo','Deje al menos un metro cuando sea posible. Espere si no puede adelantar con seguridad.'],
['عند تجاوز دراجة، ما المسافة التي تتركها حيثما أمكن؟','متراً واحداً على الأقل','بضعة سنتيمترات','لا شيء إذا استعملت المنبه','عرض المرآة','اترك متراً على الأقل حيثما أمكن. انتظر إذا لم يكن التجاوز آمناً.']);
addRule(30,5,'dealing-particular-situations',
['Une dépanneuse est arrêtée, feux jaunes clignotants, dans votre sens. Que faire ?','Ralentir et changer de voie si possible en sécurité sur une route à plusieurs voies','Garder la même vitesse','Changer de voie sans vérifier','Appliquer toujours exactement 60 km/h','Ralentissez et soyez prudent. Sur plusieurs voies dans le même sens, écartez-vous d’une voie si cela est sécuritaire.'],
['A tow truck is stopped with amber lights flashing in your direction. What should you do?','Slow down and, on a multilane road, move over if safe','Maintain speed','Change lanes without checking','Always use exactly 60 km/h','Slow down and proceed carefully. With multiple lanes in your direction, move one lane away if safe.'],
['Una grúa está parada con luces amarillas intermitentes en su sentido. ¿Qué hace?','Reducir y, si hay varios carriles, apartarse uno cuando sea seguro','Mantener la velocidad','Cambiar sin mirar','Circular siempre exactamente a 60 km/h','Reduzca y avance con prudencia. Si hay varios carriles en su sentido, aléjese uno si es seguro.'],
['شاحنة سحب متوقفة وأضواؤها الصفراء تومض في اتجاه سيرك. ماذا تفعل؟','أخفف وأنتقل لمسار أبعد إذا تعددت المسارات وكان ذلك آمناً','أحافظ على السرعة','أغير المسار دون تحقق','ألتزم دائماً بسرعة 60 كم/س بالضبط','خفف وتابع بحذر. على طريق متعدد المسارات في اتجاهك، ابتعد مساراً إذا كان آمناً.']);
addRule(31,5,'stopping',
['À un passage pour piétons désigné « pedestrian crossover », quand peut-on repartir ?','Quand les piétons ont complètement traversé la chaussée','Dès qu’ils ont quitté votre voie','Dès qu’ils atteignent le milieu','En passant lentement derrière eux','À ces passages désignés, attendez que les piétons aient complètement traversé la chaussée.'],
['At a designated pedestrian crossover, when may you proceed?','When pedestrians have completely crossed the roadway','As soon as they leave your lane','When they reach the middle','By driving slowly behind them','At these designated crossovers, wait until pedestrians have fully crossed the roadway.'],
['En un paso designado «pedestrian crossover», ¿cuándo puede avanzar?','Cuando los peatones hayan cruzado toda la calzada','En cuanto salgan de su carril','Cuando lleguen al centro','Pasando despacio detrás de ellos','En estos pasos designados, espere a que los peatones hayan cruzado por completo la calzada.'],
['عند ممر مشاة مخصص «pedestrian crossover»، متى تتحرك؟','عندما يكمل المشاة عبور عرض الطريق','بمجرد مغادرتهم مساري','عند وصولهم إلى الوسط','بالمرور ببطء خلفهم','عند هذه الممرات المخصصة، انتظر حتى يكمل المشاة عبور الطريق بالكامل.']);
addRule(32,6,'getting-your-drivers-licence',
['Un titulaire G1 peut-il conduire sur la 401 ?','Seulement avec un moniteur de conduite autorisé en Ontario','Jamais, même avec un moniteur autorisé','Oui, seul le jour','Oui, avec n’importe quel adulte','L’exception aux restrictions G1 sur ces autoroutes exige un moniteur de conduite autorisé en Ontario.'],
['May a G1 holder drive on Highway 401?','Only with an Ontario-licensed driving instructor','Never, even with a licensed instructor','Yes, alone in daylight','Yes, with any adult','The exception to G1 restrictions on these highways requires an Ontario-licensed driving instructor.'],
['¿Puede conducir por la 401 alguien con G1?','Sólo con un instructor de conducción autorizado en Ontario','Nunca, ni con instructor autorizado','Sí, solo de día','Sí, con cualquier adulto','La excepción a estas restricciones G1 requiere un instructor autorizado en Ontario.'],
['هل يمكن لحامل G1 القيادة على الطريق 401؟','فقط مع مدرب قيادة مرخص في أونتاريو','أبداً حتى مع مدرب مرخص','نعم منفرداً نهاراً','نعم مع أي بالغ','استثناء قيود G1 على هذه الطرق يتطلب مدرب قيادة مرخصاً في أونتاريو.']);
addRule(33,6,'driving-along',
['Dans de bonnes conditions, quel repère minimal aide à garder une distance de suivi ?','Au moins deux secondes, davantage si nécessaire','Une demi-seconde','Une longueur de voiture à toute vitesse','La distance n’a pas d’importance','Le repère de deux secondes est un minimum dans de bonnes conditions. Augmentez la marge selon la météo, la visibilité et la circulation.'],
['In good conditions, what minimum guide helps maintain a following gap?','At least two seconds, more when needed','Half a second','One car length at every speed','Distance does not matter','Two seconds is a minimum in good conditions. Increase it for weather, visibility and traffic.'],
['En buenas condiciones, ¿qué referencia mínima ayuda a mantener distancia?','Al menos dos segundos, más si hace falta','Medio segundo','Un coche de distancia a cualquier velocidad','La distancia no importa','Dos segundos es un mínimo en buenas condiciones. Aumente el margen según clima, visibilidad y tráfico.'],
['في الظروف الجيدة، ما الحد الإرشادي الأدنى لمسافة التتابع؟','ثانيتان على الأقل وأكثر عند الحاجة','نصف ثانية','طول سيارة مهما كانت السرعة','المسافة غير مهمة','الثانيتان حد أدنى في الظروف الجيدة. زد المسافة حسب الطقس والرؤية والمرور.']);
addRule(34,6,'changing-positions',
['Après un dépassement, quand revenir à droite ?','Après avoir créé assez d’espace, signalé et vérifié','Dès que votre pare-chocs dépasse l’autre voiture','Sans clignotant','En coupant devant le véhicule','Revenez lorsque la manœuvre est sûre. Ne vous rabattez pas trop près du véhicule dépassé.'],
['After passing, when should you move back right?','After creating enough space, signalling and checking','As soon as your bumper is ahead','Without signalling','By cutting in front','Move back when safe. Do not cut too closely in front of the vehicle you passed.'],
['Tras adelantar, ¿cuándo vuelve a la derecha?','Cuando haya espacio suficiente, señalizando y comprobando','En cuanto su parachoques esté delante','Sin señalizar','Cerrando el paso al otro vehículo','Vuelva cuando sea seguro. No se incorpore demasiado cerca del vehículo adelantado.'],
['بعد التجاوز، متى تعود يميناً؟','بعد ترك مساحة كافية والإشارة والتحقق','بمجرد تقدم المصد','دون إشارة','بقطع الطريق أمام المركبة','عد عندما تكون المناورة آمنة، ولا تدخل قريباً جداً أمام المركبة التي تجاوزتها.']);
addRule(35,6,'changing-positions',
['Avant de changer de voie, quelle vérification reste indispensable en plus des rétroviseurs ?','L’angle mort du côté du déplacement','Seulement le compteur','Seulement la caméra de recul','Aucune si le clignotant est activé','Vérifiez la circulation, signalez et contrôlez l’angle mort avant le déplacement. Le clignotant ne donne pas la priorité.'],
['Before changing lanes, what check is essential in addition to mirrors?','The blind spot on the side you will move toward','Only the speedometer','Only the reversing camera','None if the signal is on','Check traffic, signal and check the blind spot before moving. A signal does not give priority.'],
['Antes de cambiar de carril, ¿qué debe comprobar además de los espejos?','El ángulo muerto del lado al que va','Sólo el velocímetro','Sólo la cámara de marcha atrás','Nada si ya señaliza','Compruebe el tráfico, señalice y revise el ángulo muerto antes de moverse. Señalizar no da prioridad.'],
['قبل تغيير المسار، ما الفحص الضروري إضافة للمرايا؟','النقطة العمياء في جهة الانتقال','عداد السرعة فقط','كاميرا الرجوع فقط','لا شيء إذا شغلت الإشارة','تحقق من المرور وأعطِ الإشارة وافحص النقطة العمياء قبل التحرك. الإشارة لا تمنح الأولوية.']);
addRule(36,6,'freeway-driving',
['Une voie est indiquée comme sortie obligatoire. Que faire si vous y êtes déjà et ne pouvez plus changer en sécurité ?','Prendre la sortie puis recalculer son trajet','Couper les voies à la dernière seconde','Reculer','S’arrêter dans la voie','Une erreur d’itinéraire ne justifie pas une manœuvre dangereuse. Sortez et reprenez votre trajet en sécurité.'],
['You are in an exit-only lane and cannot safely move out. What should you do?','Take the exit and reroute','Cut across lanes at the last second','Reverse','Stop in the lane','A route mistake never justifies a dangerous manoeuvre. Exit and safely reroute.'],
['Está en un carril de salida obligatoria y no puede cambiar con seguridad. ¿Qué hace?','Tomar la salida y recalcular','Cruzar carriles a última hora','Dar marcha atrás','Parar en el carril','Equivocarse de ruta no justifica una maniobra peligrosa. Salga y retome la ruta con seguridad.'],
['أنت في مسار خروج إلزامي ولا يمكنك تغييره بأمان. ماذا تفعل؟','آخذ المخرج وأعيد تخطيط الطريق','أقطع المسارات في آخر لحظة','أرجع للخلف','أتوقف في المسار','خطأ الطريق لا يبرر مناورة خطرة. خذ المخرج وعدّل مسارك بأمان.']);
addRule(37,7,'driving-night-and-bad-weather',
['La chaussée est verglacée. Comment adapter la conduite ?','Réduire la vitesse, augmenter les distances et agir doucement','Garder les mêmes distances','Freiner brutalement pour tester','Accélérer pour passer rapidement','L’adhérence peut être très faible. Adaptez la marge et évitez les gestes brusques.'],
['The road is icy. How should you adapt?','Reduce speed, increase gaps and use gentle inputs','Keep the same gaps','Brake hard to test it','Accelerate to get through quickly','Grip can be very low. Increase your safety margin and avoid sudden inputs.'],
['La calzada tiene hielo. ¿Cómo adapta la conducción?','Reduce, aumenta distancias y actúa con suavidad','Mantiene las distancias','Frena fuerte para probar','Acelera para pasar rápido','La adherencia puede ser mínima. Aumente el margen y evite movimientos bruscos.'],
['الطريق مغطى بالجليد. كيف تتكيف؟','أخفف السرعة وأزيد المسافة وأتحكم بلطف','أبقي المسافة كما هي','أفرمل بقوة للاختبار','أسرع للعبور','قد يكون التماسك ضعيفاً جداً. زد هامش الأمان وتجنب الحركات المفاجئة.']);
addRule(38,7,'driving-night-and-bad-weather',
['Une route est inondée et la profondeur est inconnue. Que faire ?','Éviter de s’y engager et choisir un autre trajet sûr','Accélérer dans l’eau','Suivre un camion','Traverser parce que l’eau paraît calme','On ne peut pas juger la profondeur ni l’état de la chaussée sous l’eau. Choisissez une alternative sûre.'],
['A road is flooded and the depth is unknown. What should you do?','Avoid entering and choose a safe alternate route','Accelerate through it','Follow a truck','Cross because the water looks calm','You cannot judge the depth or road condition under water. Choose a safe alternative.'],
['Una vía está inundada y desconoce la profundidad. ¿Qué hace?','Evitar entrar y elegir otra ruta segura','Acelerar en el agua','Seguir a un camión','Cruzar porque el agua está tranquila','No puede juzgar la profundidad ni el estado del pavimento bajo el agua. Elija una alternativa segura.'],
['طريق مغمور بالماء وعمقه مجهول. ماذا تفعل؟','أتجنب الدخول وأختار طريقاً بديلاً آمناً','أسرع عبر الماء','أتبع شاحنة','أعبر لأن الماء هادئ','لا يمكنك تقدير العمق أو حالة الطريق تحت الماء. اختر بديلاً آمناً.']);

const ISSUES=[
{id:'lights',key:'issueLights',icon:'traffic',objective:['Choisir une réponse sûre au jaune, au rouge et au passage au vert.','Choose a safe response to amber, red and a light turning green.','Elegir una respuesta segura ante amarillo, rojo y cambio a verde.','اختر تصرفاً آمناً عند الأصفر والأحمر والتحول للأخضر.'],observe:['Le feu, les piétons et les véhicules déjà engagés.','The light, pedestrians and vehicles already crossing.','El semáforo, peatones y vehículos que ya cruzan.','الإشارة والمشاة والمركبات التي بدأت العبور.'],decide:['Vérifier si l’arrêt ou le passage peut se faire sans danger.','Check whether stopping or proceeding can be safe.','Comprobar si puede parar o avanzar sin peligro.','تحقق من إمكانية التوقف أو المرور بأمان.'],act:['Respecter le signal et garder une marge pour les autres.','Obey the signal and leave a safety margin for others.','Respetar la señal y dejar un margen a los demás.','احترم الإشارة واترك هامش أمان للآخرين.'],exercise:['Avec le moniteur, commenter les risques à plusieurs intersections. Ne provoquez jamais un passage au jaune pour vous entraîner.','With your instructor, discuss risks at several intersections. Never deliberately create an amber-light situation for practice.','Con el instructor, comente riesgos en varios cruces. Nunca provoque una situación de amarillo para practicar.','ناقش المخاطر في عدة تقاطعات مع المدرب. لا تتعمد خلق موقف عند الأصفر للتدريب.']},
{id:'checks',key:'issueChecks',icon:'eye',objective:['Observer les rétroviseurs et l’angle mort avant de se déplacer.','Check mirrors and blind spots before moving.','Comprobar espejos y ángulo muerto antes de moverse.','افحص المرايا والنقطة العمياء قبل التحرك.'],observe:['La circulation devant, derrière et à côté.','Traffic ahead, behind and beside you.','El tráfico delante, detrás y al lado.','المرور أمامك وخلفك وبجانبك.'],decide:['Choisir un espace suffisant ; le clignotant ne donne pas la priorité.','Choose a sufficient gap; signalling does not give priority.','Elegir espacio suficiente; señalizar no da prioridad.','اختر مساحة كافية؛ الإشارة لا تمنح الأولوية.'],act:['Signaler, contrôler l’angle mort, puis bouger doucement si la voie reste libre.','Signal, check the blind spot, then move smoothly if the way remains clear.','Señalizar, revisar el ángulo muerto y moverse suavemente si sigue libre.','أعطِ الإشارة وافحص النقطة العمياء ثم تحرك بلطف إذا بقي المسار خالياً.'],exercise:['Pratiquer les départs du bord de route et les changements de voie avec observation du moniteur.','Practise moving off from the roadside and lane changes under your instructor’s observation.','Practicar salidas desde el borde y cambios de carril bajo observación del instructor.','تدرّب على الانطلاق من جانب الطريق وتغيير المسار تحت ملاحظة المدرب.']},
{id:'junctions',key:'issueJunctions',icon:'junction',objective:['S’arrêter au bon endroit et identifier qui peut passer.','Stop in the correct place and identify who may proceed.','Parar en el lugar correcto e identificar quién pasa.','توقف في المكان الصحيح وحدد من يمر.'],observe:['La signalisation, la ligne d’arrêt et tous les usagers.','Signs, the stop line and all road users.','Señales, línea de detención y todos los usuarios.','اللوحات وخط التوقف وجميع مستخدمي الطريق.'],decide:['Identifier la priorité et une ouverture sûre.','Identify priority and a safe opening.','Identificar la prioridad y una oportunidad segura.','حدد الأولوية وفرصة آمنة.'],act:['Faire un arrêt complet si requis et s’engager seulement si le passage est libre.','Stop fully if required and proceed only when the path is clear.','Detenerse por completo cuando corresponda y avanzar sólo si está libre.','توقف تماماً عند اللزوم ولا تتحرك إلا إذا خلا المسار.'],exercise:['Répéter des intersections variées. Le moniteur observe l’arrêt, le regard et la décision.','Practise varied intersections. The instructor observes the stop, checks and decision.','Practicar cruces variados. El instructor observa parada, observación y decisión.','تدرّب في تقاطعات متنوعة ليراقب المدرب التوقف والنظر والقرار.']},
{id:'turns',key:'issueTurns',icon:'turn',objective:['Préparer le virage et conserver une trajectoire adaptée.','Prepare the turn and maintain a suitable path.','Preparar el giro y mantener una trayectoria adecuada.','استعد للانعطاف وحافظ على مسار مناسب.'],observe:['La voie, les piétons, les cyclistes et la sortie du virage.','The lane, pedestrians, cyclists and the turn’s exit.','El carril, peatones, ciclistas y salida del giro.','المسار والمشاة والدراجات ومخرج الانعطاف.'],decide:['Préparer sa position et sa vitesse avant de tourner.','Prepare position and speed before turning.','Preparar posición y velocidad antes de girar.','جهز موضعك وسرعتك قبل الانعطاف.'],act:['Signaler à temps, céder si nécessaire et tourner sans couper les autres voies.','Signal in good time, yield as needed and turn without cutting across other lanes.','Señalizar a tiempo, ceder cuando corresponda y girar sin invadir otros carriles.','أعطِ الإشارة مبكراً وأعطِ الأولوية عند الحاجة وانعطف دون قطع المسارات الأخرى.'],exercise:['Répéter des virages à droite et à gauche à des intersections adaptées au niveau de l’élève.','Practise right and left turns at intersections suited to the learner’s level.','Practicar giros a derecha e izquierda en cruces adecuados al nivel del alumno.','كرر الانعطاف يميناً ويساراً في تقاطعات تناسب مستوى المتعلم.']},
{id:'speed',key:'issueSpeed',icon:'gauge',objective:['Adapter la vitesse avant les dangers et les nouvelles limites.','Adapt speed before hazards and new limits.','Adaptar la velocidad antes de riesgos y nuevos límites.','كيّف السرعة قبل المخاطر والحدود الجديدة.'],observe:['Les limites, la visibilité, la météo et la circulation.','Limits, visibility, weather and traffic.','Límites, visibilidad, clima y tráfico.','الحدود والرؤية والطقس والمرور.'],decide:['Choisir une vitesse compatible avec la limite et les conditions.','Choose a speed suitable for the limit and conditions.','Elegir velocidad compatible con el límite y las condiciones.','اختر سرعة تناسب الحد والظروف.'],act:['Ajuster progressivement sans freinage ou accélération inutilement brusque.','Adjust gradually without unnecessary sharp braking or acceleration.','Ajustar gradualmente sin frenadas o aceleraciones bruscas innecesarias.','عدّل تدريجياً دون فرملة أو تسارع مفاجئ غير ضروري.'],exercise:['Repérer les changements de limite assez tôt et préparer les ralentissements avec le moniteur.','Spot changes in limits early and prepare to slow with your instructor.','Detectar cambios de límite con antelación y preparar reducciones con el instructor.','تعرف على تغير الحدود مبكراً واستعد للتخفيف مع المدرب.']},
{id:'parking',key:'issueParking',icon:'parking',objective:['Observer tout autour et corriger une manœuvre lentement.','Observe all around and correct a manoeuvre slowly.','Observar alrededor y corregir la maniobra lentamente.','راقب المحيط وصحح المناورة ببطء.'],observe:['Les piétons, les obstacles et l’espace autour du véhicule.','Pedestrians, obstacles and space around the vehicle.','Peatones, obstáculos y espacio alrededor del vehículo.','المشاة والعوائق والمساحة حول المركبة.'],decide:['S’arrêter si la visibilité ou l’espace ne sont pas suffisants.','Stop if visibility or space is insufficient.','Parar si la visibilidad o el espacio no bastan.','توقف إذا لم تكفِ الرؤية أو المساحة.'],act:['Manœuvrer à faible vitesse et vérifier à nouveau après chaque pause.','Manoeuvre at low speed and recheck after each pause.','Maniobrar despacio y volver a comprobar después de cada pausa.','ناور ببطء وأعد التحقق بعد كل توقف.'],exercise:['Pratiquer le stationnement et le recul dans un espace adapté avec le moniteur, puis corriger calmement la position.','Practise parking and reversing in a suitable area with your instructor, then calmly correct your position.','Practicar estacionamiento y marcha atrás en un lugar adecuado con el instructor y corregir con calma.','تدرّب على الركن والرجوع في مكان مناسب مع المدرب، ثم صحح الموضع بهدوء.']},
{id:'gap',key:'issueGap',icon:'distance',objective:['Conserver une marge devant et l’augmenter selon les conditions.','Keep a gap ahead and increase it as conditions require.','Mantener espacio delante y aumentarlo según las condiciones.','حافظ على مسافة أمامك وزدها حسب الظروف.'],observe:['Le véhicule devant et les ralentissements plus loin.','The vehicle ahead and traffic slowing further ahead.','El vehículo de delante y las reducciones más adelante.','المركبة أمامك والتباطؤ في الأمام.'],decide:['Prévoir assez d’espace pour réagir sans geste brusque.','Allow enough space to react without sudden inputs.','Dejar espacio suficiente para reaccionar sin brusquedad.','اترك مساحة كافية للاستجابة دون حركة مفاجئة.'],act:['Relâcher progressivement l’accélérateur et rétablir une distance adaptée.','Ease off gradually and restore a suitable gap.','Soltar gradualmente el acelerador y recuperar una distancia adecuada.','خفف ضغط التسارع تدريجياً واستعد مسافة مناسبة.'],exercise:['Utiliser un repère fixe avec le moniteur pour évaluer la distance de suivi, puis augmenter la marge si nécessaire.','Use a fixed roadside marker with your instructor to assess the following gap, increasing it when needed.','Usar un punto fijo con el instructor para evaluar la distancia y aumentarla si hace falta.','استخدم معلماً ثابتاً مع المدرب لتقدير مسافة التتابع وزدها عند الحاجة.']},
{id:'highway',key:'issueHighway',icon:'road',objective:['Préparer les insertions et les sorties sans décision précipitée.','Prepare entries and exits without rushed decisions.','Preparar entradas y salidas sin decisiones precipitadas.','جهز الاندماج والخروج دون قرارات متسرعة.'],observe:['La circulation, les panneaux de voie et l’espace disponible.','Traffic, lane signs and available space.','El tráfico, señales de carril y espacio disponible.','المرور ولوحات المسارات والمساحة المتاحة.'],decide:['Choisir une ouverture sûre ou continuer jusqu’à la prochaine sortie.','Choose a safe gap or continue to the next exit.','Elegir un espacio seguro o continuar hasta la próxima salida.','اختر فرصة آمنة أو تابع إلى المخرج التالي.'],act:['Signaler, vérifier et changer de voie progressivement, sans dépasser la limite.','Signal, check and change lanes gradually without exceeding the limit.','Señalizar, comprobar y cambiar gradualmente sin superar el límite.','أعطِ الإشارة وتحقق وغيّر المسار تدريجياً دون تجاوز الحد.'],exercise:['Préparer les entrées et sorties avec un moniteur autorisé, en respectant les restrictions du permis détenu.','Practise entries and exits with a licensed instructor, respecting the restrictions of your licence.','Practicar entradas y salidas con un instructor autorizado y respetando las restricciones de su permiso.','تدرّب على المداخل والمخارج مع مدرب مرخص مع احترام قيود رخصتك.']}
];
addRule(39,0,'parking-along-roadways',
['Votre stationnement est mal aligné. Que faire ?','S’arrêter, vérifier autour et corriger lentement','Accélérer pour finir vite','Corriger sans regarder','Ouvrir la porte en mouvement','Une correction calme et observée est préférable à une manœuvre précipitée. Restez attentif aux piétons et aux obstacles.'],
['Your parking position is poorly aligned. What do you do?','Stop, check around and correct slowly','Accelerate to finish quickly','Correct without checking','Open the door while moving','A calm, observed correction is better than rushing. Watch pedestrians and obstacles.'],
['Ha estacionado mal alineado. ¿Qué hace?','Parar, comprobar alrededor y corregir lentamente','Acelerar para terminar','Corregir sin mirar','Abrir la puerta en movimiento','Una corrección tranquila y observada es mejor que apresurarse. Vigile peatones y obstáculos.'],
['موضع ركنك غير مضبوط. ماذا تفعل؟','أتوقف وأتحقق حولي وأصحح ببطء','أسرع للانتهاء','أصحح دون النظر','أفتح الباب أثناء الحركة','التصحيح الهادئ مع المراقبة أفضل من التسرع. انتبه للمشاة والعوائق.']);
addRule(40,0,'changing-directions',
['Avant de reculer, peut-on se fier uniquement à la caméra ?','Non, il faut vérifier tout autour et regarder dans le sens du déplacement','Oui, si l’image est nette','Oui, avec les feux de détresse','Oui, sur une courte distance','La caméra est une aide. Vérifiez les zones qu’elle ne montre pas et continuez à observer pendant la manœuvre.'],
['Before reversing, can you rely only on the camera?','No, check all around and look in the direction of travel','Yes, if the image is clear','Yes, with hazard lights on','Yes, for a short distance','The camera is an aid. Check areas it does not show and keep observing throughout the manoeuvre.'],
['Antes de dar marcha atrás, ¿puede fiarse sólo de la cámara?','No, compruebe alrededor y mire en la dirección del movimiento','Sí, si la imagen es clara','Sí, con luces de emergencia','Sí, en una distancia corta','La cámara es una ayuda. Compruebe lo que no muestra y siga observando durante la maniobra.'],
['قبل الرجوع، هل تعتمد على الكاميرا وحدها؟','لا، أتحقق من المحيط وأنظر في اتجاه الحركة','نعم إذا كانت الصورة واضحة','نعم مع أضواء التحذير','نعم لمسافة قصيرة','الكاميرا وسيلة مساعدة. تحقق مما لا تعرضه وواصل المراقبة أثناء المناورة.']);
const SCENARIOS=[
{id:'green',q:'n3',issue:'lights',level:'G2',scene:'green',title:['Le feu vient de passer au vert','The light just turned green','La luz acaba de ponerse verde','تحول الضوء للتو إلى الأخضر'],intro:['Vous êtes en première position au feu. Un piéton termine encore sa traversée devant vous.','You are first at the light. A pedestrian is still crossing ahead of you.','Es el primero ante el semáforo. Un peatón aún cruza por delante.','أنت الأول عند الإشارة وما زال أحد المشاة يعبر أمامك.']},
{id:'amber',q:'n1',issue:'lights',level:'G2',scene:'amber',title:['Le jaune à l’approche du carrefour','Amber as you approach','Amarillo al acercarse','الأصفر عند الاقتراب'],intro:['Vous approchez d’un feu qui change. Vous devez évaluer la possibilité d’un arrêt sûr.','You approach a light that changes. You must assess whether a safe stop is possible.','Se acerca a un semáforo que cambia. Debe evaluar si puede detenerse con seguridad.','تقترب من إشارة تتغير وعليك تقدير إمكانية التوقف بأمان.']},
{id:'red',q:'n2',issue:'lights',level:'G2',scene:'red',title:['Tourner à droite au rouge','Turning right on red','Girar a la derecha en rojo','الانعطاف يميناً عند الأحمر'],intro:['Vous voulez tourner à droite. Le feu est rouge : quels éléments conditionnent votre décision ?','You want to turn right. The light is red: what determines your decision?','Quiere girar a la derecha. Está rojo: ¿qué determina su decisión?','تريد الانعطاف يميناً والإشارة حمراء. ما الذي يحدد قرارك؟']},
{id:'lane',q:'n35',issue:'checks',level:'G2',scene:'lane',title:['Le changement de voie','Changing lanes','El cambio de carril','تغيير المسار'],intro:['Vous avez regardé vos rétroviseurs. Un véhicule peut encore se trouver hors de leur champ de vision.','You have checked your mirrors. A vehicle may still be outside their field of view.','Ha mirado los espejos. Aún puede haber un vehículo fuera de su campo de visión.','فحصت المرايا، لكن قد تبقى مركبة خارج مجال رؤيتها.']},
{id:'stop',q:'n8',issue:'junctions',level:'G2',scene:'stop',title:['Un arrêt au bon endroit','Stopping in the right place','Parar en el lugar correcto','التوقف في المكان الصحيح'],intro:['Vous arrivez à un STOP. Une ligne d’arrêt précède le passage des piétons.','You approach a STOP sign. A stop line is before the crosswalk.','Llega a un STOP. Hay una línea antes del paso peatonal.','تصل إلى علامة توقف ويوجد خط قبل ممر المشاة.']},
{id:'turn',q:'n15',issue:'turns',level:'G2',scene:'turn',title:['Préparer son virage','Preparing a turn','Preparar el giro','الاستعداد للانعطاف'],intro:['Votre moniteur vous demande de tourner au prochain carrefour. Vous avez le temps de préparer la manœuvre.','Your instructor asks you to turn at the next intersection. You have time to prepare.','Su instructor le pide girar en el próximo cruce. Tiene tiempo para prepararse.','يطلب المدرب الانعطاف في التقاطع التالي ولديك وقت للاستعداد.']},
{id:'school',q:'n11',issue:'speed',level:'G2',scene:'speed',title:['Adapter sa vitesse près d’une école','Adjusting speed near a school','Adaptar la velocidad cerca de una escuela','تكييف السرعة قرب المدرسة'],intro:['Vous entrez dans un secteur scolaire. Les panneaux peuvent inclure des horaires ou des feux.','You enter a school area. Signs may include times or flashing lights.','Entra en una zona escolar. Las señales pueden incluir horarios o luces.','تدخل منطقة مدرسية وقد تتضمن اللوحات أوقاتاً أو أضواء.']},
{id:'parking',q:'n39',issue:'parking',level:'G2',scene:'parking',title:['Corriger un stationnement','Correcting your parking','Corregir el estacionamiento','تصحيح الركن'],intro:['La voiture n’est pas bien alignée dans l’espace. Vous pouvez reprendre la manœuvre calmement.','Your car is not aligned in the space. You can calmly adjust the manoeuvre.','El coche no está alineado. Puede corregir la maniobra con calma.','السيارة غير مصطفة في المكان ويمكنك التصحيح بهدوء.']},
{id:'reverse',q:'n40',issue:'parking',level:'G2',scene:'parking',title:['Reculer en gardant une vue d’ensemble','Reversing with full awareness','Retroceder observando el entorno','الرجوع مع مراقبة المحيط'],intro:['La caméra de recul est allumée. Elle ne montre pas nécessairement tous les obstacles autour de vous.','The reversing camera is on. It may not show every obstacle around you.','La cámara está encendida, pero puede no mostrar todos los obstáculos.','كاميرا الرجوع تعمل، لكنها قد لا تعرض جميع العوائق حولك.']},
{id:'gap',q:'n33',issue:'gap',level:'G2',scene:'gap',title:['Retrouver une distance suffisante','Restoring a safe following gap','Recuperar una distancia suficiente','استعادة مسافة كافية'],intro:['La circulation ralentit et votre espace devant diminue. Un repère fixe vous aide à évaluer votre marge.','Traffic slows and your gap shrinks. A fixed marker helps assess your margin.','El tráfico frena y se reduce su espacio. Un punto fijo le ayuda a medir el margen.','يتباطأ المرور وتتقلص المسافة أمامك. يساعدك معلم ثابت على تقدير هامشك.']},
{id:'merge',q:'r76',issue:'highway',level:'G',scene:'merge',title:['Trouver sa place à l’entrée','Finding a safe merge','Encontrar espacio al incorporarse','إيجاد فرصة آمنة للاندماج'],intro:['Vous êtes sur la voie d’accélération avec votre moniteur. Vous recherchez une ouverture dans la circulation.','You are on the acceleration lane with your instructor, looking for a gap in traffic.','Está en el carril de aceleración con su instructor y busca un espacio.','أنت في مسار التسارع مع المدرب وتبحث عن مساحة في المرور.']},

function ensureBde(){state.bde={lang:language==='fr'?'fr':'en',answers:{},completed:{},session:null,...state.bde};if(!['fr','en'].includes(state.bde.lang))state.bde.lang='en';}
function bl(){ensureBde();return state.bde.lang;}
function bt(key){return BDE_TEXT[key]?.[bl()==='fr'?0:1]||key;}
function bitem(q){return (q.revised||q)[bl()];}
function bnote(q){return q.review?.[bl()]||'';}
function bq(id){return BDE_DATA.find(q=>q.id===id);}
function bactive(q){return !q.review?.hold;}
function btopic(n){return BDE_TOPICS[n-1][bl()==='fr'?0:1];}
function bmodule(code){return code==='final'?bt('final'):code==='review'?bt('selfReview'):'Quiz '+code+' · '+btopic(Number(code));}
function bstats(){ensureBde();const a=Object.entries(state.bde.answers).filter(([id])=>bq(id)&&bactive(bq(id)));return {rated:a.filter(([,r])=>r.rating!==null).length,known:a.filter(([,r])=>r.rating==='known').length,review:a.filter(([,r])=>r.rating==='review').length};}
function bmark(q){return q.review?`<span class="tag ${q.review.hold?'gold':q.review.kind==='updated'?'green':'navy'}">${bt(q.review.kind)}</span>`:'';}
function blang(){return `<div class="bde-language"><label for="bdeLanguage">${bt('lang')}</label><select id="bdeLanguage" class="field"><option value="fr" ${bl()==='fr'?'selected':''}>Français · aide</option><option value="en" ${bl()==='en'?'selected':''}>English · original</option></select><p>${bt('langNote')}</p></div>`;}
function bhead(title,sub){return `<div class="bde-content" lang="${bl()}" dir="ltr">${head(title,sub,'BDE')}`;}
function bfoot(){return `<p class="bde-scope">${icon('info')}${bt('scope')}</p></div>`;}
function bsource(q){return `<span class="small">CARS · ${q.module==='final'?'Final test':'Quiz '+q.module} · ${bt('question')} ${q.number} · ${bt('page')} ${q.page}</span>`;}
function boriginal(q){return `<details class="bde-original"><summary>${bt('original')}</summary><p class="small">${bt('originalWarning')}</p><p lang="en">${esc(q.en.q)}</p><p lang="en"><b>${esc(q.en.a)}</b></p></details>`;}
function bnotice(q){if(!q.review)return '';return `<div class="bde-note ${q.review.hold?'held':''}">${bmark(q)}<p>${esc(bnote(q))}</p>${q.review.url?`<a href="${q.review.url}" target="_blank" rel="noopener noreferrer">${bt('sourceLink')} ${icon('external')}</a>`:''}</div>`;}
function renderBde(){ensureBde();const st=bstats();return `${bhead(bt('title'),bt('sub'))}${blang()}<div class="bde-intro card"><div><span class="eyebrow">${bt('source')}</span><h2>20 ${bl()==='fr'?'quiz':'quizzes'} · ${BDE_DATA.length} ${bt('questions')}</h2><p>${bt('intro')}</p></div></div>${state.bde.session&&!state.bde.session.finished?`<div class="bde-resume notice"><span>${bt('resumeText')}</span>${nav(bt('resume'),'bde-session','arrow','btn')}</div>`:''}<div class="bde-overview"><section class="card bde-final"><div class="theme-symbol">${icon('exam')}</div><h2>${bt('final')}</h2><p>${bt('finalSub')}</p>${btn(bt('startFinal'),'bde-start','',`data-id="final"`)}</section><section class="card"><div class="section-head"><h2>${bt('selfReview')}</h2><strong class="big-number">${st.review}</strong></div><p class="muted">${st.rated} / ${BDE_DATA.length} ${bt('rated').toLowerCase()} · ${st.known} ${bt('selfKnown').toLowerCase()}</p>${st.review?btn(bt('reviewButton'),'bde-start','secondary',`data-id="review"`):`<p class="small spacer-top">${bt('emptyReview')}</p>`}</section></div><div class="section-head"><h2>${bt('quizzes')}</h2><span class="small">${bt('translation')}</span></div><div class="bde-module-grid">${BDE_TOPICS.map((_,i)=>{const code=i+1,qs=BDE_DATA.filter(q=>q.module===code),active=qs.filter(bactive),rated=active.filter(q=>state.bde.answers[q.id]?.rating!=null).length,known=active.filter(q=>state.bde.answers[q.id]?.rating==='known').length;return `<article class="card bde-module"><div class="theme-top"><span class="bde-index">${String(code).padStart(2,'0')}</span>${state.bde.completed[code]?`<span class="tag green">${icon('check')}${bt('complete')}</span>`:`<span class="tag navy">${active.length} ${bt('questions')}</span>`}</div><h3>${btopic(code)}</h3><p class="small">${rated} / ${active.length} ${bt('rated').toLowerCase()} · ${known} ${bt('selfKnown').toLowerCase()}</p><div class="progress-track"><div class="progress-fill" style="width:${rated/active.length*100}%"></div></div>${btn(bt('start'),'bde-start','secondary full',`data-id="${code}"`)}</article>`}).join('')}</div><div class="spacer-top">${nav(bt('changesButton'),'bde-updates','info','btn ghost small')}</div>${bfoot()}`;}
function bsession(){ensureBde();const s=state.bde.session;return s&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(id=>bq(id)&&bactive(bq(id)))?s:null;}
function renderBdeSession(){const s=bsession();if(!s)return renderBde();if(s.finished)return renderBdeResult();const q=bq(s.ids[s.index]),d=bitem(q);return `${bhead(bmodule(s.module),'')}${blang()}<div class="quiz-wrap"><div class="quiz-top">${btn(`${icon('left')} ${bt('pause')}`,'bde-pause','ghost')}<span>${bt('question')} <b>${s.index+1}</b> ${bt('of')} ${s.ids.length}</span></div><div class="progress-track" role="progressbar" aria-label="${bt('questions')}" aria-valuenow="${s.index}" aria-valuemin="0" aria-valuemax="${s.ids.length}"><div class="progress-fill" style="width:${s.index/s.ids.length*100}%"></div></div><article class="card quiz-card bde-question"><div class="question-kicker">${bsource(q)}${bmark(q)}</div><h2>${esc(d.q.replace(/\[SELECT\]/g,'…'))}</h2>${q.image?`<div class="question-image"><img src="${q.image}" alt="${bl()==='fr'?'Panneau à identifier':'Sign to identify'}"></div>`:''}<label for="bdeAnswer">${bt('answerLabel')}</label><textarea id="bdeAnswer" class="field" rows="4" maxlength="2000" dir="auto" placeholder="${bt('placeholder')}">${esc(s.drafts[q.id]||'')}</textarea><p class="small">${bt('endOnly')}</p><div class="bde-answer-actions">${s.index?btn(bt('previous'),'bde-previous','secondary'):''}${btn(bt('skip'),'bde-skip','ghost')}${btn(`${s.index===s.ids.length-1?bt('finish'):bt('next')} ${icon('arrow')}`,'bde-next','',!s.drafts[q.id]?.trim()?'disabled':'')}</div></article></div>${bfoot()}`;}
function renderBdeResult(){const s=bsession();if(!s||!s.finished)return renderBde();const rated=s.ids.filter(id=>state.bde.answers[id]?.rating!=null).length,known=s.ids.filter(id=>state.bde.answers[id]?.rating==='known').length;return `${bhead(bt('result'),bmodule(s.module))}${blang()}<div class="card bde-result-intro"><h2>${bt('complete')}</h2><p>${bt('resultSub')}</p><div class="bde-result-counts"><span><b>${rated} / ${s.ids.length}</b> ${bt('rated').toLowerCase()}</span><span><b>${known}</b> ${bt('selfKnown').toLowerCase()}</span></div><div class="action-row">${nav(bt('back'),'bde','left','btn secondary')}${btn(bt('again'),'bde-start','',`data-id="${s.module}"`)}</div></div><div class="bde-reviews">${s.ids.map((id,i)=>{const q=bq(id),d=bitem(q),a=state.bde.answers[id];return `<article class="card bde-review" id="bde-review-${id}"><div class="question-kicker">${bsource(q)}${bmark(q)}</div><h3>${i+1}. ${esc(d.q.replace(/\[SELECT\]/g,'…'))}</h3>${q.image?`<img class="bde-result-image" src="${q.image}" alt="${bl()==='fr'?'Panneau étudié':'Sign reviewed'}">`:''}<div class="bde-answer-compare"><div><h4>${bt('answerLabel')}</h4><p dir="auto">${a?.text?esc(a.text):bt('blank')}</p></div><div class="bde-expected"><h4>${bt('expected')}</h4><p>${esc(d.a)}</p></div></div>${bnotice(q)}<div class="bde-rating" role="group" aria-label="${bt('rated')}"><button class="btn ${a?.rating==='known'?'':'secondary'}" data-action="bde-rate" data-id="${id}" data-rating="known" aria-pressed="${a?.rating==='known'}">${icon('check')}${bt('knownButton')}</button><button class="btn ${a?.rating==='review'?'':'secondary'}" data-action="bde-rate" data-id="${id}" data-rating="review" aria-pressed="${a?.rating==='review'}">${icon('refresh')}${bt('reviewRating')}</button><span class="small">${a?.rating==null?bt('unrated'):''}</span></div>${q.review?boriginal(q):''}</article>`}).join('')}</div>${bfoot()}`;}
function renderBdeUpdates(){const items=BDE_DATA.filter(q=>q.review);return `${bhead(bt('changes'),bt('changesSub'))}${blang()}<div class="action-row" style="margin-bottom:22px">${nav(bt('back'),'bde','left','btn secondary')}</div><div class="notice">${bt('changesNote')}</div><div class="bde-reviews">${items.map(q=>`<article class="card bde-review"><div class="question-kicker">${bsource(q)}${bmark(q)}</div><h3>${esc(bitem(q).q)}</h3>${bnotice(q)}${!q.review.hold?`<p class="bde-current"><b>${bt('expected')}</b><br>${esc(bitem(q).a)}</p>`:''}${boriginal(q)}</article>`).join('')}</div>${bfoot()}`;}
function bdeHomeLink(){ensureBde();return `<div class="bde-home-callout"><div>${icon('book')}<span><b>${bt('homeTitle')}</b><small>${bt('homeSub')}</small></span></div>${nav(bt('homeOpen'),'bde','arrow','btn secondary')}</div>`;}
function startBde(code){ensureBde();let ids=code==='review'?BDE_DATA.filter(q=>bactive(q)&&state.bde.answers[q.id]?.rating==='review').map(q=>q.id):BDE_DATA.filter(q=>bactive(q)&&String(q.module)===String(code)).map(q=>q.id);if(!ids.length){toast(bt('emptyReview'));return;}const start=()=>{state.bde.session={module:code,ids,index:0,drafts:{},finished:false};persist();go('bde-session');};if(bsession()&&!state.bde.session.finished)confirmDialog(bt('replaceTitle'),bt('replaceBody'),bt('newSession'),start);else start();}
function bnext(skip=false){const s=bsession();if(!s||s.finished)return;const id=s.ids[s.index];if(skip)s.drafts[id]='';else if(!s.drafts[id]?.trim())return;if(s.index===s.ids.length-1){s.finished=true;for(const qid of s.ids)state.bde.answers[qid]={text:s.drafts[qid]||'',rating:null,date:new Date().toISOString()};state.bde.completed[s.module]=new Date().toISOString();persist();go('bde-result');}else{s.index++;persist();render(true);}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||!b.dataset.action.startsWith('bde-'))return;const action=b.dataset.action,id=b.dataset.id;if(action==='bde-start')startBde(id);else if(action==='bde-next')bnext();else if(action==='bde-skip')bnext(true);else if(action==='bde-previous'){const s=bsession();if(s&&s.index>0){s.index--;persist();render(true);}}else if(action==='bde-pause'){persist();go('bde');}else if(action==='bde-rate'){const a=state.bde.answers[id];if(!a||!['known','review'].includes(b.dataset.rating))return;a.rating=b.dataset.rating;persist();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});$(`[data-action="bde-rate"][data-id="${id}"][data-rating="${a.rating}"]`)?.focus({preventScroll:true});}});
document.addEventListener('input',e=>{if(e.target.id==='bdeAnswer'){const s=bsession();if(!s||s.finished)return;s.drafts[s.ids[s.index]]=e.target.value;persist();const next=$('[data-action="bde-next"]');if(next)next.disabled=!e.target.value.trim();}});
document.addEventListener('change',e=>{if(e.target.id==='bdeLanguage'){ensureBde();state.bde.lang=e.target.value;persist();render();}});

const PREP_TOPICS=[
 {id:'before',icon:'clock',label:['Avant l’examen','Before the test','Antes del examen','قبل الامتحان'],
