[build]
  command = "node reparer-francoroute.mjs && npm run build && node scripts/prepare-database.mjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  included_files = ["private/application.html"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
